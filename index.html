/* ====================== 导入多文件 ====================== */
// 支持的扩展名：覆盖「常见音频 + 视频容器（自动抽取音轨）+ 专业/冷门音频」
const AUDIO_EXT_RE = /\.(wav|wave|bwf|mp3|mp2|mpga|mp1|m4a|m4b|m4r|m4p|mp4|m4v|aac|adts|ogg|oga|ogx|opus|webm|weba|flac|alac|caf|aif|aiff|aifc|amr|awb|3gp|3gpp|3g2|wma|asf|mka|mkv|ts|mts|m2ts|mov|qt|avi|flv|f4v|f4a|mpg|mpeg|vob|ogv|rm|ra|rmvb|ape|mac|wv|tta|au|snd|voc|ac3|eac3|dts|dtshd|gsm|silk|slk|mid|midi|kar|rmi|spx|mlp|thd|cda|aa|aax|oma|at3|vqf|dss|dvf|msv|shn|tak|svx|sf|xi|s3m|mod|it|xm|mtm|dsm|med|umx|psm|ptm|dbm|imf|mptm|mo3|gbs|nsf|spc|vgm|ay|sid|sap|sf2|sf3|dls)$/i;
function isAudioFile(f){
  if (!f) return false;
  const t = (f.type || "").toLowerCase();
  if (t.startsWith("audio")) return true;
  if (t.startsWith("video")) return true;       // 视频容器：抽取其音轨
  if (t === "application/ogg" || t === "application/x-ogg") return true;
  // 手机上很多音频被标成 octet-stream 或空类型：统一按扩展名兜底判断
  return AUDIO_EXT_RE.test(f.name || "");
}
// 是否为视频类容器（解码时给用户额外提示）
function isVideoContainer(f){
  const t = (f.type || "").toLowerCase();
  if (t.startsWith("video")) return true;
  return /\.(mp4|m4v|webm|mkv|mov|avi|flv|f4v|mpg|mpeg|vob|ogv|rm|rmvb|ts|mts|m2ts|3gp|3gpp|3g2)$/i.test(f.name || "");
}
// 纯 JS 解析 WAV（不依赖 decodeAudioData，作为兜底）
function decodeWavPureJS(arrayBuffer){
  const dv = new DataView(arrayBuffer);
  if (dv.getUint32(0, false) !== 0x52494646) throw new Error("非 WAV 文件"); // 'RIFF'
  if (dv.getUint32(8, false) !== 0x57415645) throw new Error("非 WAVE 格式"); // 'WAVE'
  let pos = 12, fmt = null, dataOffset = 0, dataLen = 0;
  while (pos + 8 <= dv.byteLength){
    const id = dv.getUint32(pos, false);
    const size = dv.getUint32(pos + 4, true);
    const body = pos + 8;
    if (id === 0x666d7420){ // 'fmt '
      fmt = {
        audioFormat: dv.getUint16(body, true),
        channels: dv.getUint16(body + 2, true),
        sampleRate: dv.getUint32(body + 4, true),
        bitsPerSample: dv.getUint16(body + 14, true),
      };
      // 兼容 WAVE_FORMAT_EXTENSIBLE
      if (fmt.audioFormat === 0xFFFE && size >= 40) fmt.audioFormat = dv.getUint16(body + 24, true);
    } else if (id === 0x64617461){ // 'data'
      dataOffset = body; dataLen = size; break;
    }
    pos = body + size + (size % 2);
  }
  if (!fmt || !dataOffset) throw new Error("WAV 结构不完整");
  const ch = fmt.channels, sr = fmt.sampleRate, bits = fmt.bitsPerSample;
  const bytesPerSample = bits / 8;
  const frameCount = Math.floor(dataLen / (bytesPerSample * ch));
  const mono = new Float32Array(frameCount);
  const isFloat = fmt.audioFormat === 3;
  for (let i = 0; i < frameCount; i++){
    let sum = 0;
    for (let c = 0; c < ch; c++){
      const off = dataOffset + (i * ch + c) * bytesPerSample;
      let v = 0;
      if (isFloat && bits === 32) v = dv.getFloat32(off, true);
      else if (bits === 16) v = dv.getInt16(off, true) / 32768;
      else if (bits === 8)  v = (dv.getUint8(off) - 128) / 128;
      else if (bits === 24){ const b0=dv.getUint8(off),b1=dv.getUint8(off+1),b2=dv.getInt8(off+2); v = ((b2<<16)|(b1<<8)|b0) / 8388608; }
      else if (bits === 32) v = dv.getInt32(off, true) / 2147483648;
      sum += v;
    }
    mono[i] = sum / ch;
  }
  // 构造一个"类 AudioBuffer"对象供后续分析使用
  return {
    sampleRate: sr, length: frameCount, duration: frameCount / sr, numberOfChannels: 1,
    getChannelData: () => mono,
  };
}

async function handleImportFiles(fileList){
  const all = Array.from(fileList || []);
  if (!all.length){ toast("未选择文件"); return; }
  const files = all.filter(isAudioFile);
  const skipped = all.length - files.length;
  if (!files.length){
    openModal(`<h3>没有可用的音频文件</h3>
      <p>你选择的文件里没有识别到音频。支持的格式：<br>
      <b>WAV / MP3 / M4A / AAC / OGG / OPUS / FLAC / CAF / AMR / WebM<br>
      MP4 / MOV / MKV / AVI / TS / 3GP（视频会自动抽取音轨）<br>
      WMA / MKA / AU / VOC / AC3 / MIDI 等</b></p>
      <p style="font-size:12px;color:var(--muted)">提示：微信语音（.silk）需先转成 MP3 或 M4A；若在手机上从「文件」App 选择，请确认文件已下载到本地（非云端占位）。</p>
      <div class="row"><button class="mbtn primary" id="impOk">知道了</button></div>`);
    $("impOk").onclick = closeModal;
    return;
  }
  // 数量上限：不超过 7 个（当前已有 + 本次选择 的总数）
  const existing = state.tracks.filter(t => t.points && t.points.length).length;
  if (existing + files.length > MAX_TRACKS){
    const room = Math.max(0, MAX_TRACKS - existing);
    openModal(`<h3>已达导入上限</h3>
      <p>对比分析最多支持 <b>${MAX_TRACKS}</b> 条音轨。<br>
      当前已有 <b>${existing}</b> 条，本次还可导入 <b>${room}</b> 个文件。</p>
      <p style="font-size:12px;color:var(--muted)">请减少文件数量后重试，或先点底部白色按钮清空重来。</p>
      <div class="row"><button class="mbtn primary" id="impOk">我知道了</button></div>`);
    $("impOk").onclick = closeModal;
    flashNotice("已达导入上限（最多 " + MAX_TRACKS + " 个）", 1000);
    return;
  }
  // 大文件提示
  const tooBig = files.some(f => f.size > LARGE_FILE);
  if (tooBig){
    const cont = await confirmDialog("文件过大", "有文件超过 15MB，解析可能较慢，是否继续？");
    if (!cont) return;
  }
  // 不清空旧轨道，改为"追加"；首次导入时才切换到对比模式
  if (!state.compareMode){
    state.compareMode = true;
    state.tracks = state.tracks.filter(t => t.points && t.points.length);
  }
  resizeCanvases();
  buildComparePanel();

  const ctx = getCtx();
  const failed = [];
  for (const f of files){
    toast("解析中：" + f.name);
    let handled = false, errMsg = "";
    try {
      const ab = await f.arrayBuffer();
      let buf = null;
      // ① 优先用浏览器原生解码（现代浏览器可自动从视频容器中抽取音轨）
      try {
        buf = await ctx.decodeAudioData(ab.slice(0));
      } catch(e1){
        // ② 是 WAV 就用纯 JS 兜底解析
        const isWav = /\.wav$/i.test(f.name) || (f.type === "audio/wav") || (f.type === "audio/x-wav") || (f.type === "audio/wave");
        if (isWav){
          try { buf = decodeWavPureJS(ab); } catch(e2){ errMsg = e2.message || String(e2); }
        }
        if (!buf){
          // ③ 再用 <audio> 元素解码兜底（覆盖 decodeAudioData 不支持的容器，如部分 rm/ape 包装）
          try { buf = await decodeViaElement(f); } catch(e3){}
        }
        if (!buf){
          const hint = isVideoContainer(f)
            ? "浏览器无法从该视频容器抽取音轨，建议先用工具转成 MP3/M4A"
            : "浏览器不支持该格式（" + (e1.name || "解码失败") + "）";
          throw new Error(hint);
        }
      }
      addCompareTrackFromBuffer(f.name, buf);
      // 等待该轨道的音高分析完成
      const tr = state.tracks[state.tracks.length - 1];
      await waitTrackAnalyzed(tr, 20000);
      handled = true;
    } catch(e){
      errMsg = e.message || String(e);
    }
    if (!handled){ failed.push({ name: f.name, err: errMsg }); }
    drawSpectrum(); buildComparePanel();
  }
  resizeCanvases();
  if (failed.length){
    const list = failed.map(x => "• <b>" + x.name + "</b><br><span style='font-size:12px;color:var(--muted)'>" + x.err + "</span>").join("<br>");
    openModal(`<h3>部分文件解析失败（${failed.length}/${files.length}）</h3>
      <div style="font-size:13px;line-height:1.8">${list}</div>
      <p style="font-size:12px;color:var(--muted)">建议：把音频转成 <b>WAV</b> 或 <b>MP3</b> 后重试成功率最高。微信语音请先转发到电脑或用工具转码。</p>
      <div class="row"><button class="mbtn primary" id="fOk">知道了</button></div>`);
    $("fOk").onclick = closeModal;
  } else if (files.length){
    const skippedMsg = skipped > 0 ? ("（跳过 " + skipped + " 个非音频文件）") : "";
    toast("已导入 " + files.length + " 个文件" + skippedMsg);
  }
}
// 等待某轨道音高分析完成（points 非空或超时）
function waitTrackAnalyzed(tr, timeoutMs){
  return new Promise((resolve) => {
    const t0 = Date.now();
    const timer = setInterval(() => {
      if ((tr.points && tr.points.length > 0) || Date.now() - t0 > timeoutMs){
        clearInterval(timer); resolve();
      }
    }, 120);
  });
}
// 用 <audio>/<video> 元素解码兜底：部分容器 decodeAudioData 不接受，但媒体元素可解
function decodeViaElement(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const el = document.createElement("video");     // video 可同时承载音/视频容器
    el.preload = "auto"; el.muted = true; el.playsInline = true; el.src = url;
    let done = false;
    const cleanup = () => { try { URL.revokeObjectURL(url); } catch(e){} };
    const fail = (m) => { if (done) return; done = true; cleanup(); reject(new Error(m)); };
    const ok = async () => {
      if (done) return;
      done = true;
      try {
        const ab = await (await fetch(url)).arrayBuffer();
        const buf = await getCtx().decodeAudioData(ab);
        cleanup(); resolve(buf);
      } catch(e){ cleanup(); reject(e); }
    };
    el.onloadeddata = ok;
    el.oncanplaythrough = ok;
    el.onerror = () => fail("媒体元素无法解析该文件");
    setTimeout(() => fail("解码超时"), 15000);
  });
}

/* ====================== 叠加录制（另一条音轨，换色） ====================== */
function startOverlayMode(){
  // 叠加分析：新开一条轨道、用下一种颜色，从时间 0 开始（区别于"续录"）
  const activeCount = state.tracks.filter(t => t.points && t.points.length).length;
  if (state.compareMode && activeCount >= MAX_TRACKS){
    flashNotice("已达录制 / 分析上限（最多 " + MAX_TRACKS + " 段）", 1000);
    return;
  }
  if (!state.compareMode || !state.tracks.some(t => t.points && t.points.length)){
    state.compareMode = true;
    state.tracks = [ newTrack("第 1 段录音", 0) ];
    state.activeTrackIdx = 0;
  } else {
    const idx = state.tracks.length;            // 颜色按顺序取，与导入 7 文件一致
    state.tracks.push(newTrack("叠加 " + (idx + 1), idx));
    state.activeTrackIdx = idx;
  }
  emptyHint.classList.add("hidden");
  buildComparePanel();
  resizeCanvases();
  toast("叠加录制：将从时间 0 开始，用新颜色标记第 " + (state.activeTrackIdx + 1) + " 条音轨");
}

}

    : "当前没有已分析的内容，是否重置为初始状态？";

// 重置：停止一切播放/录制，清空所有轨道，恢复初始单轨道与提示
function resetToInitial(){
  try { if (state.mode === "recording") stopRecording(); } catch(e) {}
  try { if (state.mode === "playing") stopAllPlayback(); } catch(e) {}
  // 断开可能残留的麦克风流
  try {
    if (state.recording && state.recording.stream){
      state.recording.stream.getTracks().forEach(t => t.stop());
    }
  } catch(e) {}
  state.mode = "idle";
  state.recording = null;
  state.followRec = false;
  state.userScrolling = false;
  state.autofollowPausedUntil = 0;
  state.compareMode = false;
  state.activeTrackIdx = 0;
  // 恢复初始单轨道
  state.tracks = [ newTrack("第 1 段录音", 0) ];
  // UI 复位
  micBtn.classList.remove("rec"); micBtn.textContent = "●";
  playBtn.textContent = "▶ 播放"; playBtn.disabled = true;
  comparePanel.classList.remove("show"); comparePanel.innerHTML = "";
  emptyHint.classList.remove("hidden");
  // 清空本地对比/会话暂存（保留已保存录音列表，用户可在侧栏自行删除）
  try { state.tracks.forEach(t => { t.points = []; }); } catch(e) {}
  // 视角与画布复位
  scrollArea.scrollLeft = 0;
  state.scrolledInit = false;
  resizeCanvases();
  centerOnC4();
  buildComparePanel();
  drawSpectrum();
}

function renderSessList(){
  const list = $("sessList"); list.innerHTML = "";

  if (!sessions.length){ list.innerHTML = '<div style="font-size:11px;color:var(--muted);padding:6px">暂无保存的录音</div>'; return; }
  sessions.slice().reverse().forEach(s => {
    const div = document.createElement("div");
    div.className = "sessItem";
    div.innerHTML = `<div><div class="nm">${s.name}</div><div class="meta">${s.points? s.points.length:0} 点 · ${(s.duration||0).toFixed(1)}s</div></div>
      <div class="del" data-id="${s.id}">删除</div>`;
    div.querySelector(".del").addEventListener("click", (ev) => {
      ev.stopPropagation();

    list.appendChild(div);
  });
}
function loadSessionToView(s){
  stopAllPlayback();
  state.compareMode = false;
  state.tracks = [ newTrack(s.name, 0) ];
  state.tracks[0].points = s.points || [];
  state.tracks[0].duration = s.duration || (s.points && s.points.length ? s.points[s.points.length-1].t : 0);

let deferredInstallPrompt = null;
function registerServiceWorker(){
  // 注册 Service Worker：离线可用 + 可「添加到主屏幕」当安装包使用
  if ("serviceWorker" in navigator && isSecure() && location.protocol !== "file:"){
    navigator.serviceWorker.register("./sw.js").then((reg) => {
      // 有新版本时自动更新，并在下次打开生效
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener("statechange", () => {
          if (nw.state === "installed" && navigator.serviceWorker.controller){
            toast("已更新到最新版，下次打开即生效");
          }
        });
      });
    }).catch(() => {});
  }
  // 捕获安装提示，供「安装到桌面」按钮使用
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    const btn = $("miInstall");
    if (btn) btn.style.display = "flex";
  });
  // 已安装为 App 时隐藏安装按钮
  window.addEventListener("appinstalled", () => {
    deferredInstallPrompt = null;
    const btn = $("miInstall");
    if (btn) btn.style.display = "none";
  });
}
async function doInstall(){
  if (deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    $("miInstall").style.display = "none";
    toast("已发起安装，请在系统提示中确认");
  } else {
    // iOS / 已安装 / 不支持自动安装时的指引
    openModal(`<h3>安装到手机桌面</h3>
      <p><b>Android / Chrome：</b>点击右上角菜单 →「安装应用 / 添加到主屏幕」。<br><br>
      <b>iPhone / Safari：</b>点击底部「分享」按钮 →「添加到主屏幕」。<br><br>
      安装后从桌面图标启动，即为独立 App 形态，可正常使用麦克风。</p>
      <div class="row"><button class="mbtn primary" id="instOk">我知道了</button></div>`);
    $("instOk").onclick = closeModal;
  }
}

  // 音名纵轴随频谱纵向滚动同步；顶部刻度条随横向滚动同步
  scrollArea.addEventListener("scroll", () => {

    syncRulerScroll();
    resyncOverlays();
    // 已导入/已录完，且有频谱线时：滑动让横线跟随竖线处的音高波动
    if (state.mode !== "recording" && state.mode !== "playing"
        && state.tracks.some(t => !t.hidden && t.points && t.points.length)){
      updateCrosshairAtCenter();
    }
  }, { passive: true });
  // 用户触摸/滑动 → 暂停自动跟随，由用户控制；停手 1.2 秒后自动回弹到跟随视角
  let _resumeTimer = null;
  const pauseAutofollow = () => {
    state.userScrolling = true;
    state.followRec = false;
    // 取消仍在跑的平滑滚动，让用户完全控制
    if (_followRAF){ cancelAnimationFrame(_followRAF); _followRAF = null; }
    if (scrollArea._smooth_scrollLeft) cancelAnimationFrame(scrollArea._smooth_scrollLeft), scrollArea._smooth_scrollLeft = null;
    if (scrollArea._smooth_scrollTop) cancelAnimationFrame(scrollArea._smooth_scrollTop), scrollArea._smooth_scrollTop = null;
    if (_resumeTimer) clearTimeout(_resumeTimer);
  };
  const scheduleResume = () => {
    if (_resumeTimer) clearTimeout(_resumeTimer);
    _resumeTimer = setTimeout(() => {
      state.userScrolling = false;
      state.autofollowPausedUntil = 0;
      // 录制中才回弹；非录制态保持用户视角
      if (state.mode === "recording") reboundToFollow();
    }, 1200); // 停手 1.2 秒后回弹
  };
  scrollArea.addEventListener("touchstart", pauseAutofollow, { passive: true });
  scrollArea.addEventListener("touchmove", pauseAutofollow, { passive: true });
  scrollArea.addEventListener("touchend", scheduleResume, { passive: true });
  scrollArea.addEventListener("touchcancel", scheduleResume, { passive: true });
  scrollArea.addEventListener("wheel", () => { pauseAutofollow(); scheduleResume(); }, { passive: true });

  /* 点击频谱：显示绿色音高标记（点击处最近的音高） */
  let _tapStart = null;
  scrollArea.addEventListener("click", (e) => {
    // 忽略明显的拖动（click 本身已排除拖动，这里再保险）
    const rect = scrollArea.getBoundingClientRect();
    const cx = e.clientX - rect.left + scrollArea.scrollLeft;
    const cy = e.clientY - rect.top + scrollArea.scrollTop;
    const tPos = cx / state.px;                 // 点击处对应的时间
    const midiClick = yToMidi(cy);              // 点击处对应的音高
    // 在所有可见轨道的音高点中，找离点击位置（时间+音高）最近的
    let best = null, bestD = Infinity;
    for (const tr of state.tracks){
      if (tr.hidden || !tr.points || !tr.points.length) continue;
      // 先在时间上定位，再比较音高
      for (let i = tr.points.length - 1; i >= 0; i--){
        const p = tr.points[i];
        const pt = p.t + (tr.offset || 0);
        const dt = Math.abs(pt - tPos);
        if (dt > 1.5) { if (pt < tPos - 1.5) break; continue; }
        const dm = Math.abs(p.midi - midiClick);
        const d = dt * 2 + dm;               // 时间权重更高
        if (d < bestD){ bestD = d; best = { p, tr, pt }; }
      }
    }
    if (best){
      const f = midiToFreq(Math.round(best.p.midi));
      showClickMarker(best.pt, best.p.midi, best.p.note + "  " + f.toFixed(1) + "Hz");
      sfxBubble("tick");
    } else {
      // 没找到频谱线，就按点击位置直接显示音高
      const m = Math.round(midiClick);
      if (m >= MIN_MIDI && m <= MAX_MIDI){
        showClickMarker(tPos, m, midiToNote(m) + "  " + midiToFreq(m).toFixed(1) + "Hz");
      }
    }
  });

  // 初始化单轨道
  state.tracks = [ newTrack("第 1 段录音", 0) ];
  firstLaunchCard();
}
window.addEventListener("resize", () => { resizeCanvases(); });
window.addEventListener("orientationchange", () => setTimeout(resizeCanvases, 300));
init();
// 尽早注册 SW 以建立离线缓存（不等首屏渲染完成）
try { registerServiceWorker(); } catch(e) {}

// 在线 / 离线状态提示（离线时页面仍可完整使用）
function updateNetBadge(){
  let b = document.getElementById("netBadge");
  if (!b){
    b = document.createElement("div");
    b.id = "netBadge";
    document.getElementById("app").appendChild(b);
  }
  const off = !navigator.onLine;
  b.textContent = off ? "离线模式（功能正常）" : "";
  b.className = off ? "show" : "";
}
window.addEventListener("online", updateNetBadge);
window.addEventListener("offline", updateNetBadge);
setTimeout(updateNetBadge, 500);
</script>
