<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="音高检测">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<title>音高检测与对比器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #000; --panel: rgba(22,22,26,.72); --panel-solid:#16161a; --line: #2a2a30; --line2: #3a3a44;
    --yellow: #ffe000; --white: #fff; --blue: #4da6ff; --red: #ff3b3b;
    --text: #e8e8ec; --muted: #8a8a94;
    --c-yellow: #ffe000; --c-white: #ffffff; --c-blue: #7ec8ff;
    --c-orange: #ff9a3c; --c-red: #ff2d2d; --c-pink: #ff7ad9; --c-purple: #8a2be2;
    --glass: saturate(160%) blur(18px);
    --shadow: 0 8px 28px rgba(0,0,0,.55);
    --glow-y: 0 0 18px rgba(255,224,0,.35);
  }
  html, body {
    height: 100%; width: 100%; overflow: hidden;
    background: radial-gradient(120% 80% at 50% 0%, #15151b 0%, #000 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  #app { display: flex; flex-direction: column; height: 100%; position: relative; }

  /* 顶部波形区 */
  #waveformWrap { height: 10%; min-height: 58px; position: relative; background: linear-gradient(180deg,#0c0c10,#060608); border-bottom: 1px solid var(--line); box-shadow: inset 0 -1px 0 rgba(255,255,255,.04); }
  #wave { display: block; width: 100%; height: 100%; }
  #waveHint { position: absolute; left: 10px; top: 6px; font-size: 10px; color: var(--muted); letter-spacing: .5px; pointer-events: none; }

  /* 主频谱区 */
  #spectrumWrap { flex: 1 1 auto; position: relative; display: flex; overflow: hidden; min-height: 0; }
  #noteAxis { width: 48px; flex: 0 0 48px; height: 100%; overflow: hidden; position: relative; background: linear-gradient(90deg,#000,#0a0a0e); border-right: 1px solid var(--line); pointer-events: none; }
  #noteAxisInner { position: relative; width: 100%; }
  .noteLabel {
    position: absolute; right: 4px; transform: translateY(-50%);
    font-size: 9px; line-height: 1; color: var(--muted); cursor: pointer; white-space: nowrap;
    padding: 2px 4px; border-radius: 6px; text-align: right; transition: background .15s, color .15s;
    pointer-events: auto;
  }
  .noteLabel.isC { color: var(--white); font-size: 10px; font-weight: 700; }
  .noteLabel:active, .noteLabel.hot { background: var(--yellow); color: #000; box-shadow: var(--glow-y); }

  /* 滚动层：显式高度 + 明确允许横纵手势，保证任何情况下都能上下滑动看音域 */
  #scrollArea { flex: 1 1 auto; height: 100%; min-height: 0; position: relative; overflow: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y pan-x; overscroll-behavior: contain; }
  #specContent { position: relative; }
  #spectrum { display: block; }

  /* 顶部时间刻度条：覆盖在频谱顶端，横向与频谱同步滚动 */
  #timeRuler {
    position: absolute; top: 0; left: 48px; right: 0; height: 24px;
    pointer-events: none; z-index: 22;
    background: linear-gradient(180deg, rgba(0,0,0,.92), rgba(0,0,0,.6) 70%, rgba(0,0,0,.28));
    border-bottom: 1px solid rgba(255,255,255,.14);
    overflow: hidden;
  }
  #rulerCanvas { display: block; height: 24px; }

  /* 红色十字准星：竖直时间线 + 水平音高线 + 交点圆点 */
  #crosshairV {
    position: absolute; top: 0; bottom: 0; width: 0;
    border-left: 1.5px solid #ff1744; z-index: 8; pointer-events: none;
    box-shadow: 0 0 6px rgba(255,23,68,.9);
    display: none;
  }
  #crosshairH {
    position: absolute; left: 0; right: 0; height: 0;
    border-top: 1.5px solid #ff1744; z-index: 8; pointer-events: none;
    box-shadow: 0 0 6px rgba(255,23,68,.9);
    display: none;
  }
  #crosshairDot {
    position: absolute; width: 7px; height: 7px; border-radius: 50%;
    background: #ff1744; z-index: 9; pointer-events: none;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 8px rgba(255,23,68,1);
    display: none;
  }
  /* 十字准星旁的音高标签（圆滑小矩形） */
  #crosshairTag {
    position: absolute; z-index: 11; pointer-events: none;
    padding: 3px 9px; border-radius: 9px;
    background: rgba(0,0,0,.9); font-size: 13px; font-weight: 800;
    border: 1.5px solid #fff; white-space: nowrap;
    transform: translate(12px, -50%);
    box-shadow: 0 2px 10px rgba(0,0,0,.65);
    display: none;
  }
  #crosshairTag.high { color: #ffe000; border-color: #ffe000; box-shadow: 0 0 14px rgba(255,224,0,.55), 0 2px 10px rgba(0,0,0,.65); }
  #crosshairTag.mid { color: #ffffff; border-color: #ffffff; }
  #crosshairTag.low { color: #ff3b30; border-color: #ff3b30; box-shadow: 0 0 14px rgba(255,59,48,.5), 0 2px 10px rgba(0,0,0,.65); }
  #crosshairTag small { font-size: 10px; font-weight: 600; opacity: .8; margin-left: 3px; }

  /* 点击频谱线的绿色音高标记 */
  #clickMarkerDot {
    position: absolute; width: 8px; height: 8px; border-radius: 50%;
    background: #00e676; z-index: 10; pointer-events: none;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 10px rgba(0,230,118,.95), 0 0 3px #fff inset;
    display: none;
  }
  #clickMarkerBox {
    position: absolute; z-index: 10; pointer-events: none;
    padding: 3px 8px; border-radius: 9px;
    background: rgba(0,0,0,.88); color: #00e676; font-size: 12px; font-weight: 700;
    border: 1px solid #00e676; white-space: nowrap;
    transform: translate(10px, -50%);
    box-shadow: 0 2px 10px rgba(0,0,0,.6);
    display: none;
  }
  /* 红色音高横线的颜色分级（亮黄 / 白 / 红），由 JS 动态设置 */
  #crosshairH.hi { border-top-color: var(--yellow); box-shadow: 0 0 6px rgba(255,224,0,.9); }
  #crosshairH.lo { border-top-color: #ff3b30; box-shadow: 0 0 6px rgba(255,59,48,.9); }
  #emptyHint {
    position: absolute; left: 48px; right: 0; top: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; color: var(--muted); font-size: 13px; text-align: center; padding: 0 20px; pointer-events: none; z-index: 6;
    transition: opacity .3s;
  }
  #emptyHint > * { background: rgba(0,0,0,.55); backdrop-filter: blur(2px); border-radius: 10px; padding: 2px 10px; }
  #emptyHint .big { font-size: 34px; filter: drop-shadow(0 0 10px rgba(255,224,0,.4)); background: none; }

  /* 播放跟随标签 */
  .pitchLabel {
    position: absolute; transform: translate(-50%, -50%);
    background: rgba(0,0,0,.85); color: #fff; border: 1px solid rgba(255,255,255,.7);
    padding: 3px 8px; border-radius: 10px; font-size: 12px; font-weight: 700;
    pointer-events: none; white-space: nowrap; z-index: 5; backdrop-filter: var(--glass);
    box-shadow: 0 2px 10px rgba(0,0,0,.6);
  }
  .pitchLabel.high { color: var(--yellow); border-color: var(--yellow); box-shadow: var(--glow-y); }
  .pitchLabel.low { color: var(--red); border-color: var(--red); box-shadow: 0 0 14px rgba(255,59,59,.45); }

  /* 音名 Hz 弹窗 */
  #notePopup {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    background: rgba(10,10,12,.86); color: #fff; border: 1px solid var(--yellow);
    padding: 8px 16px; border-radius: 14px; font-size: 15px; font-weight: 600;
    z-index: 30; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; text-align: center;
    backdrop-filter: var(--glass); box-shadow: var(--glow-y), var(--shadow);
  }
  #notePopup.show { opacity: 1; transform: translateX(-50%) translateY(2px); }
  #notePopup small { display: block; color: var(--muted); font-weight: 400; font-size: 10px; margin-top: 2px; }

  /* 多轨对比顶部面板 */
  #comparePanel {
    position: absolute; left: 0; right: 0; top: 26px; z-index: 20;   /* 下移到时间轴下方，保证 0.1s 刻度完整可见 */
    background: rgba(12,12,16,.86); border-bottom: 1px solid var(--line);
    display: none; flex-direction: column; padding: 6px 8px 2px; gap: 4px;
    max-height: 52%; backdrop-filter: var(--glass);
    border-radius: 0 0 14px 14px; box-shadow: 0 8px 22px rgba(0,0,0,.55);
  }
  #comparePanel.show { display: flex; }
  /* 顶部圆按钮行（完整展开时也可见） */
  .cmpCircleRow { display: flex; flex-wrap: wrap; gap: 7px; padding: 2px 2px 5px; justify-content: center; }
  .cmpCircleBtn {
    width: 30px; height: 30px; border-radius: 50%; flex: 0 0 30px; border: 2px solid rgba(255,255,255,.65);
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800;
    color: #050505; cursor: pointer; transition: transform .12s, box-shadow .2s, opacity .2s, border-color .2s;
    box-shadow: 0 0 0 1px #000, 0 0 12px var(--ring, #fff), 0 0 4px var(--ring, #fff) inset;
    position: relative; opacity: 1;
  }
  .cmpCircleBtn .num { position: relative; z-index: 2; text-shadow: 0 0 2px rgba(0,0,0,.6); }
  .cmpCircleBtn.off { border-color: rgba(255,255,255,.18); opacity: .38; box-shadow: 0 0 0 1px #000; }
  .cmpCircleBtn:active { transform: scale(.9); }
  /* 折叠后的短条 */
  #comparePanel.collapsed { max-height: 44px; padding: 5px 8px; overflow: hidden; }
  #comparePanel.collapsed .cmpBody { display: none; }
  #comparePanel.collapsed .cmpCircleRow {
    flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start;
    scrollbar-width: none; padding-right: 46px;
  }
  #comparePanel.collapsed .cmpCircleRow::-webkit-scrollbar { display: none; }
  #comparePanel.collapsed .cmpCircleBtn { width: 32px; height: 32px; flex: 0 0 32px; font-size: 13px; }
  #comparePanel.collapsed .cmpCollapseBtn {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    margin: 0; width: 38px; height: 38px; border-radius: 12px;
  }
  #comparePanel.collapsed .cmpCollapseBtn:active { transform: translateY(-50%) scale(.94); }
  .cmpBody { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
  /* 底部折叠按钮（圆滑矩形 + 向上箭头） */
  .cmpCollapseBtn {
    align-self: center; width: 76px; height: 22px; margin: 3px 0 1px; flex: 0 0 auto;
    border: 1px solid rgba(255,255,255,.22); border-radius: 11px; background: rgba(255,255,255,.08);
    display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer;
    transition: background .15s, transform .12s;
  }
  .cmpCollapseBtn:active { background: rgba(255,255,255,.2); transform: scale(.94); }
  .cmpCollapseBtn svg { width: 18px; height: 18px; transition: transform .25s; }
  #comparePanel.collapsed .cmpCollapseBtn svg { transform: rotate(180deg); }
  .cmpRow { display: flex; align-items: center; gap: 8px; font-size: 11px; background: rgba(255,255,255,.03); border-radius: 10px; padding: 3px 6px; }
  .cmpDot {
    width: 15px; height: 15px; border-radius: 50%; flex: 0 0 15px; border: 2px solid transparent;
    box-shadow: 0 0 0 1px #000, 0 0 6px currentColor;
  }
  .cmpDot.active { border-color: #fff; box-shadow: 0 0 0 1px #000, 0 0 8px #fff; }
  .cmpName { flex: 1 1 auto; color: var(--white); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 5px 2px; }
  .cmpName:active { color: var(--yellow); }
  .cmpIcon {
    width: 26px; height: 26px; flex: 0 0 26px; border: 1px solid var(--line2); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; color: var(--white); font-size: 11px; background: rgba(255,255,255,.05);
    transition: color .15s, border-color .15s, background .15s;
  }
  .cmpIcon:active { background: rgba(255,255,255,.12); }
  .cmpIcon.on { color: var(--blue); border-color: var(--blue); background: rgba(77,166,255,.12); box-shadow: 0 0 10px rgba(77,166,255,.4); }
  .cmpIcon.bgm { font-weight: 800; letter-spacing: -1px; }
  .cmpOffsetWrap { display: none; padding: 4px 8px 6px 26px; }
  .cmpOffsetWrap.show { display: block; }
  .cmpOffsetWrap input[type=range] { width: 100%; accent-color: var(--blue); }

  /* 底部控制栏 */
  #controls { height: 13%; min-height: 78px; flex: 0 0 auto; position: relative;
    display: flex; align-items: center; justify-content: center; border-top: 1px solid var(--line);
    background: linear-gradient(0deg,#0a0a0e,#060608); box-shadow: inset 0 1px 0 rgba(255,255,255,.04); }
  .ctrlBtn {
    width: 70px; height: 70px; border-radius: 50%; border: none; color: #000; font-size: 28px;
    display: flex; align-items: center; justify-content: center; background: var(--yellow);
    box-shadow: var(--glow-y), 0 6px 18px rgba(0,0,0,.5); cursor: pointer; transition: transform .1s;
  }
  .ctrlBtn.rec { background: var(--red); color: #fff; box-shadow: 0 0 18px rgba(255,59,59,.55), 0 6px 18px rgba(0,0,0,.5); animation: pulse 1.2s infinite; }
  .ctrlBtn:active { transform: scale(.93); }
  @keyframes pulse { 0%,100%{ box-shadow:0 0 12px rgba(255,59,59,.45),0 6px 18px rgba(0,0,0,.5);} 50%{ box-shadow:0 0 26px rgba(255,59,59,.85),0 6px 18px rgba(0,0,0,.5);} }
  .sideToggle {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    width: 48px; height: 48px; border-radius: 14px; border: 1px solid var(--line2);
    background: rgba(255,255,255,.05); color: var(--white); font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    backdrop-filter: var(--glass); box-shadow: var(--shadow);
  }
  .sideToggle:active { background: rgba(255,255,255,.14); }
  .auxBtn {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line2);
    background: rgba(255,255,255,.05); color: var(--white); font-size: 13px; display: flex; align-items: center; justify-content: center; cursor: pointer; gap: 6px;
    backdrop-filter: var(--glass); box-shadow: var(--shadow);
  }
  .auxBtn:active { background: rgba(255,255,255,.14); }
  .auxBtn[disabled] { opacity: .3; pointer-events: none; }

  /* 白色圆形「清空重来」按钮 */
  .resetBtn {
    position: absolute; left: 50%; top: 50%;
    transform: translate(calc(-50% + 66px), -50%);
    width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(0,0,0,.12);
    background: #ffffff; color: #111; display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.45); transition: transform .1s, background .15s;
  }
  .resetBtn:active { transform: translate(calc(-50% + 66px), -50%) scale(.9); background: #e8e8e8; }
  .resetBtn svg { display: block; }
  .recDot { width: 12px; height: 12px; border-radius: 50%; background: var(--red); }

  /* 侧边栏（玻璃质感） */
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); backdrop-filter: blur(2px); z-index: 40; display: none; }
  #overlay.show { display: block; }
  #sidebar {
    position: fixed; top: 0; right: 0; height: 100%; width: 84%; max-width: 380px;
    background: var(--panel); z-index: 50; transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1);
    display: flex; flex-direction: column; border-left: 1px solid var(--line2);
    backdrop-filter: var(--glass); box-shadow: -10px 0 40px rgba(0,0,0,.6);
  }
  #sidebar.show { transform: translateX(0); }
  #sidebarHeader { padding: 18px 18px 12px; font-size: 17px; font-weight: 700; color: #fff; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
  #sidebarHeader .close { font-size: 22px; cursor: pointer; color: var(--muted); width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 10px; }
  #sidebarHeader .close:active { background: rgba(255,255,255,.1); }
  #sidebarBody { padding: 12px; overflow-y: auto; flex: 1; }
  .menuItem {
    padding: 15px 14px; margin-bottom: 9px; background: rgba(255,255,255,.05); border: 1px solid var(--line);
    border-radius: 14px; color: var(--white); font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 12px;
    transition: background .15s, transform .08s; box-shadow: 0 2px 10px rgba(0,0,0,.3);
  }
  .menuItem:active { background: rgba(255,224,0,.12); transform: scale(.98); }
  .menuItem .ic { font-size: 19px; width: 24px; text-align: center; }
  .menuTitle { font-size: 11px; color: var(--muted); margin: 16px 4px 8px; text-transform: uppercase; letter-spacing: 1.5px; }
  .sessItem { padding: 11px 13px; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 7px; font-size: 12px; color: var(--text); display: flex; justify-content: space-between; align-items: center; }
  .sessItem:active { background: rgba(255,255,255,.1); }
  .sessItem .nm { color: #fff; }
  .sessItem .meta { color: var(--muted); font-size: 10px; margin-top: 2px; }
  .sessItem .del { color: var(--red); padding: 5px 9px; border-radius: 8px; background: rgba(255,59,59,.1); }

  /* 模态框（玻璃质感） */
  #modalRoot { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.55); backdrop-filter: blur(3px); }
  #modalRoot.show { display: flex; }
  .modal {
    width: 86%; max-width: 350px; background: var(--panel); border: 1px solid var(--line2);
    border-radius: 20px; padding: 22px; color: var(--text); backdrop-filter: var(--glass); box-shadow: var(--shadow);
    animation: pop .22s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal h3 { color: #fff; font-size: 17px; margin-bottom: 12px; }
  .modal p { font-size: 13px; line-height: 1.6; margin-bottom: 16px; color: var(--muted); }
  .modal .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .mbtn {
    flex: 1 1 auto; min-width: 120px; padding: 13px; border-radius: 14px; border: 1px solid var(--line2);
    background: rgba(255,255,255,.06); color: #fff; font-size: 14px; cursor: pointer; text-align: center; transition: transform .08s, background .15s;
  }
  .mbtn.primary { background: var(--yellow); color: #000; border-color: var(--yellow); font-weight: 700; box-shadow: var(--glow-y); }
  .mbtn.blue { background: var(--blue); color: #000; border-color: var(--blue); font-weight: 700; }
  .mbtn:active { transform: scale(.96); background: rgba(255,255,255,.14); }
  .fmtSel { display: flex; flex-direction: column; gap: 9px; margin: 6px 0 16px; }
  .fmtSel label { display: flex; align-items: center; gap: 9px; font-size: 13px; padding: 10px 12px; background: rgba(255,255,255,.05); border-radius: 12px; border: 1px solid var(--line); }
  .fmtSel input { accent-color: var(--yellow); width: 16px; height: 16px; }

  /* Toast（玻璃质感气泡） */
  #toast { position: fixed; left: 50%; bottom: 17%; transform: translateX(-50%); background: rgba(10,10,12,.88); color: #fff; border: 1px solid var(--line2); padding: 10px 18px; border-radius: 22px; font-size: 13px; z-index: 80; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; max-width: 82%; text-align: center; backdrop-filter: var(--glass); box-shadow: var(--shadow); }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  /* 首次进入的非阻塞提示条（不覆盖频谱区，可随时滑动） */
  #onboardBar {
    position: fixed; left: 8px; right: 8px; bottom: 16%; z-index: 45;
    background: rgba(14,14,18,.94); border: 1px solid var(--line2); border-radius: 16px;
    padding: 10px 12px; display: flex; align-items: center; gap: 8px;
    backdrop-filter: var(--glass); box-shadow: var(--shadow);
    animation: slideUp .3s ease; max-width: 420px; margin: 0 auto;
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  #onboardBar .obText { flex: 1 1 auto; font-size: 12px; line-height: 1.5; color: var(--text); }
  #onboardBar .obBtns { display: flex; gap: 6px; flex: 0 0 auto; }
  #onboardBar .obBtn {
    padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line2);
    background: rgba(255,255,255,.06); color: #fff; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  #onboardBar .obBtn.primary { background: var(--yellow); color: #000; border-color: var(--yellow); font-weight: 700; }

  /* 在线/离线状态徽标 */
  #netBadge {
    position: fixed; top: 6px; right: 8px; z-index: 60;
    font-size: 11px; padding: 3px 8px; border-radius: 8px;
    background: rgba(255,224,0,.15); color: var(--yellow);
    border: 1px solid rgba(255,224,0,.35); pointer-events: none;
    opacity: 0; transform: translateY(-6px); transition: opacity .25s, transform .25s;
  }
  #netBadge.show { opacity: 1; transform: translateY(0); }

  /* 黑底白字提示（上限提醒等） */

<script>
"use strict";
/* ====================== 常量与工具 ====================== */
const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const MIN_MIDI = 24;   // C1
const MAX_MIDI = 108;  // C8
const SEMI_COUNT = MAX_MIDI - MIN_MIDI; // 84 个半音
const PX_PER_SEC = 70; // 时间方向基准像素/秒（实际会按时长自适应收缩）
const TRACK_COLORS = ["#ffe000","#ffffff","#7ec8ff","#ff9a3c","#ff2d2d","#ff7ad9","#8a2be2"];
const LARGE_FILE = 15 * 1024 * 1024; // 15MB
const MAX_TRACKS = 7; // 录制/导入上限：7 条（对应 7 种颜色）
// 无上限录制：不设硬上限，每 60 秒自动分段存储防内存溢出
const SEGMENT_SECONDS = 60;

// 黑底白字提示（如"已达上限"），默认 1 秒后自动消失
function flashNotice(text, ms){
  let el = document.getElementById("flashNotice");
  if (!el){
    el = document.createElement("div");
    el.id = "flashNotice";
    document.body.appendChild(el);
  }
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(flashNotice._t);
  flashNotice._t = setTimeout(() => el.classList.remove("show"), ms || 1000);
}

function freqToMidi(f){ return 69 + 12 * Math.log2(f / 440); }
function midiToFreq(m){ return 440 * Math.pow(2, (m - 69) / 12); }
function midiToNote(m){
  m = Math.round(m);
  const name = NOTE_NAMES[((m % 12) + 12) % 12];
  const octave = Math.floor(m / 12) - 1;
  return name + octave;
}
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function fmtTime(s){ const m = Math.floor(s/60); const sec = (s%60); return (m>0? m+":" : "") + sec.toFixed(1).padStart(m>0?4:3,"0"); }

/* 自相关音高检测（Chris Wilson 思路，针对人声基频） */
function autoCorrelate(buf, sampleRate){
  let SIZE = buf.length;
  let rms = 0;
  for (let i=0;i<SIZE;i++) rms += buf[i]*buf[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < 0.008) return -1; // 太安静
  let r1 = 0, r2 = SIZE - 1, thres = 0.2;
  for (let i=0;i<SIZE/2;i++){ if (Math.abs(buf[i]) < thres){ r1 = i; break; } }
  for (let i=1;i<SIZE/2;i++){ if (Math.abs(buf[SIZE-i]) < thres){ r2 = SIZE-i; break; } }
  buf = buf.subarray ? buf.subarray(r1, r2) : buf.slice(r1, r2);
  SIZE = buf.length;
  if (SIZE < 2) return -1;
  const c = new Float32Array(SIZE);
  for (let i=0;i<SIZE;i++){
    let sum = 0;
    for (let j=0;j<SIZE-i;j++) sum += buf[j]*buf[j+i];
    c[i] = sum;
  }
  let d = 0; while (d < SIZE-1 && c[d] > c[d+1]) d++;
  let maxval = -1, maxpos = -1;
  for (let i=d;i<SIZE;i++){ if (c[i] > maxval){ maxval = c[i]; maxpos = i; } }
  if (maxpos <= 0) return -1;
  let T0 = maxpos;
  const x1 = c[T0-1] || 0, x2 = c[T0], x3 = c[T0+1] || 0;
  const a = (x1 + x3 - 2*x2) / 2, b = (x3 - x1) / 2;
  if (a && !isNaN(a)) T0 = T0 - b / (2*a);
  const freq = sampleRate / T0;
  if (freq < 60 || freq > 2000) return -1;
  return freq;
}

/* ====================== 全局状态 ====================== */
const state = {
  mode: "idle",            // idle | recording | playing
  tracks: [],              // 当前显示的所有音轨
  activeTrackIdx: 0,       // 当前录制写入的轨道
  compareMode: false,      // 多文件对比 / 叠加对比
  recording: null,         // 录制上下文
  audioCtx: null,
  followRec: false,        // 录制时是否自动跟随视角
  userScrolling: false,    // 用户是否正在手动控制视角
  autofollowPausedUntil: 0,// 用户手动操作后暂停跟随的截止时间戳
  followTargetX: null,     // 自动跟随的横向目标
  followTargetY: null,     // 自动跟随的纵向目标
  padL: 0,                 // 内容左内边距：t=0 对应的像素位置（= 屏幕中线）
};

/* ====================== DOM ====================== */
const $ = (id) => document.getElementById(id);
const waveCanvas = $("wave"), waveCtx = waveCanvas.getContext("2d");
const specCanvas = $("spectrum"), specCtx = specCanvas.getContext("2d");
const rulerCanvas = $("rulerCanvas"), rulerCtx = rulerCanvas.getContext("2d");
const noteAxis = $("noteAxis"), noteAxisInner = $("noteAxisInner"), scrollArea = $("scrollArea"), specContent = $("specContent");
const emptyHint = $("emptyHint"), comparePanel = $("comparePanel");
const notePopup = $("notePopup"), toastEl = $("toast");
const crosshairV = $("crosshairV"), crosshairH = $("crosshairH"), crosshairDot = $("crosshairDot"), crosshairTag = $("crosshairTag");
const clickMarkerDot = $("clickMarkerDot"), clickMarkerBox = $("clickMarkerBox");
let SEMI_PX = 28; // 每个半音在频谱纵向的像素（自适应）

/* ====================== 画布尺寸 ====================== */
let DPR = Math.min(window.devicePixelRatio || 1, 2);
function resizeCanvases(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const ww = waveCanvas.clientWidth, wh = waveCanvas.clientHeight;
  waveCanvas.width = ww * DPR; waveCanvas.height = wh * DPR;

  const sh = scrollArea.clientHeight;
  // 纵向：内容高度 = 可视高度 × 3（约 1/3 可见），用户可上下滑动看全音域 C1–C8
  const contentH = Math.max(sh * 3, SEMI_COUNT * 12);
  SEMI_PX = contentH / SEMI_COUNT;
  // 横向：t=0 从屏幕中线开始（padL）。这样录音最前端天生压在中央竖线上。
  state.padL = Math.round(scrollArea.clientWidth / 2);
  const maxT = currentMaxTime();
  let px = Math.max(PX_PER_SEC, 6);
  if ((maxT + 2) * px + state.padL > 32000) px = Math.max(6, (32000 - state.padL) / (maxT + 2));
  state.px = px;
  const contentW = Math.max(scrollArea.clientWidth, Math.round(state.padL + (maxT + 2) * state.px));

  specContent.style.width = contentW + "px";
  specContent.style.height = contentH + "px";
  noteAxisInner.style.height = contentH + "px";
  // 频谱画布：纵向 DPR=1（避免总高过大），横向固定像素/秒
  specCanvas.style.width = contentW + "px";
  specCanvas.style.height = contentH + "px";
  specCanvas.width = contentW;   // DPR=1
  specCanvas.height = contentH;
  // 顶部时间刻度条：宽度跟随整个内容宽度（横向与频谱同步滚动）
  layoutRuler(contentW);

  if (!state.scrolledInit){
    state.scrolledInit = true;
    centerOnC4();
  }
  buildNoteAxis();
  drawSpectrum();
}

/* ====================== 顶部时间刻度条 ====================== */
// 尺寸：宽度 = 可视区宽度（只绘制可视范围，避免超长画布），随 scrollLeft 重绘
function layoutRuler(contentW){
  if (!rulerCanvas) return;
  const h = 24;
  const vw = Math.max(1, scrollArea.clientWidth);
  rulerCanvas.style.width = vw + "px";
  rulerCanvas.style.height = h + "px";
  if (rulerCanvas.width !== vw || rulerCanvas.height !== h){
    rulerCanvas.width = vw;
    rulerCanvas.height = h;
  }
  drawRuler();
}
// 滚动时重绘（保证刻度始终对齐当前可视时间范围）
function syncRulerScroll(){
  if (!rulerCanvas) return;
  if (rulerCanvas.width !== Math.max(1, scrollArea.clientWidth)){
    layoutRuler();
    return;
  }
  drawRuler();
}
// 绘制：每 1 秒一条主刻度并标数字；0.1 秒一条小分度（0.5 秒为中刻度）
// 以 scrollLeft 为起点，只画可视区，因此超长录音也不会卡
function drawRuler(){
  if (!rulerCanvas || !rulerCtx) return;
  const w = rulerCanvas.width, h = rulerCanvas.height;
  if (!w || !h) return;
  const px = state.px || PX_PER_SEC;
  const padL = state.padL || 0;
  const offsetPx = scrollArea.scrollLeft;         // 当前可视区左边缘对应的像素位置
  const startT = Math.max(0, Math.floor((offsetPx - padL) / px));           // 起始整秒
  const endT = Math.ceil((offsetPx - padL + w) / px) + 1;

  rulerCtx.clearRect(0, 0, w, h);
  rulerCtx.fillStyle = "rgba(8,8,12,.86)";
  rulerCtx.fillRect(0, 0, w, h);
  rulerCtx.textBaseline = "top";
  rulerCtx.font = "10px -apple-system,BlinkMacSystemFont,sans-serif";

  for (let sec = startT; sec <= endT; sec++){
    for (let d = 0; d < 10; d++){
      const t = sec + d * 0.1;
      const x = padL + t * px - offsetPx;   // 转换为屏幕坐标
      if (x < -2 || x > w + 2) continue;
      let len, alpha;
      if (d === 0){ len = 13; alpha = .95; }        // 整秒：长刻度
      else if (d === 5){ len = 8; alpha = .55; }    // 0.5s：中刻度
      else { len = 4; alpha = .30; }                // 0.1s：短分度
      rulerCtx.strokeStyle = "rgba(200,205,220," + alpha + ")";
      rulerCtx.lineWidth = d === 0 ? 1.2 : 1;
      rulerCtx.beginPath();
      rulerCtx.moveTo(x + 0.5, 0);
      rulerCtx.lineTo(x + 0.5, len);
      rulerCtx.stroke();
    }
    // 整秒数字标签
    const x = padL + sec * px - offsetPx;
    if (x >= -20 && x <= w){
      rulerCtx.fillStyle = "rgba(215,220,235,.92)";
      rulerCtx.fillText(sec + "s", x + 3, 12);
    }
  }
  // 底部基线
  rulerCtx.strokeStyle = "rgba(255,255,255,.14)";
  rulerCtx.lineWidth = 1;
  rulerCtx.beginPath(); rulerCtx.moveTo(0, h - 0.5); rulerCtx.lineTo(w, h - 0.5); rulerCtx.stroke();
}

// 自动定位到人声区（C4 附近居中），C1–C8 全音域仍在画布上可滑动查看
function centerOnC4(){
  const sh = scrollArea.clientHeight;
  const yC4 = (MAX_MIDI - 60) * SEMI_PX;
  scrollArea.scrollTop = Math.max(0, yC4 - sh / 2);
  noteAxis.scrollTop = scrollArea.scrollTop;
}
function currentMaxTime(){
  let t = 8;
  for (const tr of state.tracks){
    if (tr.points.length) t = Math.max(t, tr.points[tr.points.length-1].t + (tr.offset||0) + 0.5);
    if (tr.duration) t = Math.max(t, tr.duration + (tr.offset||0));
  }
  return t;
}
// 录制增长时横向扩展：固定像素/秒，录音多长画布就多宽（时间轴可一直向右滑）
const MAX_CANVAS_W = 32000; // 浏览器 canvas 宽度安全上限
function resizeForGrowingTime(t){
  // 兼容传入 track 对象或时间数值，防 NaN；续录时把 baseTime 一起计入
  if (t && typeof t === "object"){
    const tr = t;
    const base = tr.baseTime || 0;
    t = base + (tr.startTime != null ? (performance.now() - tr.startTime) / 1000 : 0);
    if (tr.points && tr.points.length) t = Math.max(t, tr.points[tr.points.length-1].t + 0.2);
  }
  t = Number(t); if (!isFinite(t) || t < 0) t = 0;
  const newMax = Math.max(currentMaxTime(), t + 2);
  const padL = state.padL || 0;
  // 固定像素/秒；仅当超过 canvas 安全上限时才收缩（保证不失真）
  let px = PX_PER_SEC;
  if (padL + newMax * px > MAX_CANVAS_W) px = Math.max(6, (MAX_CANVAS_W - padL) / newMax);
  if (!isFinite(px) || px <= 0) return;
  state.px = px;
  const contentW = Math.max(scrollArea.clientWidth, Math.round(padL + newMax * state.px));
  if (!isFinite(contentW) || contentW <= 0) return;
  specContent.style.width = contentW + "px";
  specCanvas.style.width = contentW + "px";
  // 仅在宽度确实需要变化时才重设 canvas.width（重设会清空画布）
  if (specCanvas.width !== contentW){
    specCanvas.width = contentW;
  }
  // 自动跟随最新录制位置（由 tryAutofollow 统一管理）
  if (state.followRec) tryAutofollow();
}

/* ====================== 录制视角自动跟随 ======================
   新规则：竖线固定在屏幕正中央。
   · 横向：不依赖是否解析到音高——按"录音已进行的时间"持续推动内容向左流动，
           使最新时刻恰好落在屏幕中线上（内容左移、竖线不动）。
           这样即使整段静音，画面也会随时间的流逝平稳右移（内容左移）。
   · 纵向：仍按实际音高上下跟随（音高走低→视角下移；走高→上移）。
   · 用户手动滑动时暂停；停手 1.2s 后自动回到跟随。 */
function canAutofollow(){
  if (state.mode !== "recording") return false;
  if (state.userScrolling) return false;
  if (Date.now() < (state.autofollowPausedUntil || 0)) return false;
  return true;
}
// 横向跟随：以「频谱线最前端（最新音高时刻）」对齐屏幕中线。
//  · 因 t=0 已位于中线（padL），最前端天生压在竖线上，无需额外补偿 → 绝不错位
//  · 内容不足（最前端 < 中线）时：target 会被 clamp 到 0，不滚动
//  · 全程静音（无音高点）时：退化为按录音时钟推进，画面照常流动
function followTimelineByTime(t, track){
  if (!state.followRec || state.userScrolling || Date.now() < (state.autofollowPausedUntil || 0)) return;
  const padL = state.padL || 0;
  const tr = track || state.tracks[state.activeTrackIdx] || state.tracks[0];
  let useT = t;
  if (tr && tr.points && tr.points.length){
    const last = tr.points[tr.points.length - 1];
    useT = last.t + (tr.offset || 0);
  }
  // 内容坐标 = padL + useT*px；要让其位于中线 → scrollLeft = useT*px
  state.followTargetX = Math.max(0, useT * state.px);
}
function tryAutofollow(){
  if (!canAutofollow()) return;
  const tr = state.tracks[state.activeTrackIdx] || state.tracks[0];
  if (!tr) return;
  const vh = scrollArea.clientHeight;
  // ---- 纵向：按最新音高（若有）双向跟随 ----
  if (tr.points && tr.points.length){
    const last = tr.points[tr.points.length - 1];
    const pointY = midiToY(last.midi);
    const viewTop = scrollArea.scrollTop;
    const hiLine = viewTop + vh * (1 / 3);
    const loLine = viewTop + vh * (2 / 3);
    if (pointY < hiLine){
      state.followTargetY = Math.max(0, pointY - vh * 0.5);
    } else if (pointY > loLine){
      const maxScrollTop = Math.max(0, specCanvas.height - vh);
      state.followTargetY = Math.min(maxScrollTop, pointY - vh * 0.5);
    }
  }
}
// 统一的跟随驱动：每帧朝目标位置平滑逼近（在渲染循环里持续调用）
let _followRAF = null;
function driveAutofollow(){
  if (_followRAF) return; // 已有驱动在跑
  const step = () => {
    _followRAF = null;
    if (state.mode !== "recording") return;           // 非录制态不驱动
    if (!canAutofollow()){ return; }                  // 用户接管中，暂停
    let need = false;
    // 横向
    if (typeof state.followTargetX === "number"){
      const dx = state.followTargetX - scrollArea.scrollLeft;
      if (Math.abs(dx) > 0.5){
        scrollArea.scrollLeft += dx * 0.22;           // 缓动逼近
        need = true;
      }
    }
    // 纵向
    if (typeof state.followTargetY === "number"){
      const dy = state.followTargetY - scrollArea.scrollTop;
      if (Math.abs(dy) > 1){
        scrollArea.scrollTop += dy * 0.18;
        need = true;
      }
    }
    if (need){ syncRulerScroll?.(); resyncOverlays?.(); }
    _followRAF = requestAnimationFrame(step);
  };
  _followRAF = requestAnimationFrame(step);
}
// 用户停手后回弹：把视角重新拉回自动跟随目标
function reboundToFollow(){
  if (state.mode !== "recording") return;
  const tr = state.tracks[state.activeTrackIdx] || state.tracks[0];
  if (!tr) return;
  const t = (performance.now() - (tr.startTime || performance.now())) / 1000 + (tr.baseTime || 0);
  const vh = scrollArea.clientHeight;
  let useT = t;
  if (tr.points && tr.points.length){
    const last = tr.points[tr.points.length - 1];
    useT = last.t + (tr.offset || 0);
  }
  state.followTargetX = Math.max(0, useT * state.px);
  if (tr.points && tr.points.length){
    const last = tr.points[tr.points.length - 1];
    state.followTargetY = Math.max(0, Math.min(specCanvas.height - vh, midiToY(last.midi) - vh * 0.5));
  }
  state.userScrolling = false;
  state.followRec = true;
  driveAutofollow();
}
// 保留：单次平滑滚动（供其他场景使用）
function smoothScrollTo(el, prop, target, duration){
  const start = el[prop];
  const dist = target - start;
  if (Math.abs(dist) < 1) return;
  const t0 = performance.now();
  const key = "_smooth_" + prop;
  if (el[key]) cancelAnimationFrame(el[key]);
  const step = (now) => {
    const k = Math.min(1, (now - t0) / duration);
    const ease = 1 - Math.pow(1 - k, 3);
    el[prop] = start + dist * ease;
    if (k < 1) el[key] = requestAnimationFrame(step);
    else el[key] = null;
  };
  el[key] = requestAnimationFrame(step);
}

/* ====================== 音名纵轴 ====================== */
function buildNoteAxis(){
  noteAxisInner.innerHTML = "";
  for (let m = MAX_MIDI; m >= MIN_MIDI; m--){
    const label = document.createElement("div");
    label.className = "noteLabel" + (NOTE_NAMES[((m%12)+12)%12] === "C" ? " isC" : "");
    label.style.top = ((MAX_MIDI - m) * SEMI_PX) + "px";
    label.textContent = midiToNote(m);
    label.dataset.midi = m;
    label.addEventListener("click", () => { sfxBubble("tick"); showNoteHz(m); });
    noteAxisInner.appendChild(label);
  }
}
function midiToY(m){ return (MAX_MIDI - m) * SEMI_PX; }
function yToMidi(y){ return MAX_MIDI - y / SEMI_PX; }

/* 音高配色规则（全局统一）：
   · 高于 C5（midi > 72）→ 亮黄色
   · C3 ~ C5（48 ≤ midi ≤ 72）→ 普通白色
   · 低于 C3（midi < 48）→ 红色 */
const PITCH_HI = 72 /* C5 */, PITCH_LO = 48 /* C3 */;
const COLOR_HI = "#ffe000", COLOR_MID = "#ffffff", COLOR_LOW = "#ff3b30";
function pitchColor(midi){
  if (midi > PITCH_HI) return COLOR_HI;
  if (midi < PITCH_LO) return COLOR_LOW;
  return COLOR_MID;
}
// 配色分级名（用于 CSS class 兼容）
function pitchClass(midi){
  if (midi > PITCH_HI) return "high";
  if (midi < PITCH_LO) return "low";
  return "mid";
}

function showNoteHz(midi){
  const note = midiToNote(midi);
  const f = midiToFreq(midi);
  notePopup.innerHTML = note + " = " + f.toFixed(2) + " Hz" + "<small>A4 = 440Hz 基准</small>";
  notePopup.classList.add("show");
  clearTimeout(showNoteHz._t);
  showNoteHz._t = setTimeout(() => notePopup.classList.remove("show"), 2500);
  // 高亮被点击音名
  document.querySelectorAll(".noteLabel").forEach(el=>{
    el.classList.toggle("hot", Number(el.dataset.midi) === midi);
  });
  clearTimeout(showNoteHz._t2);
  showNoteHz._t2 = setTimeout(()=> document.querySelectorAll(".noteLabel").forEach(el=>el.classList.remove("hot")), 2500);
}

/* ====================== 红色十字准星 ======================
   坐标约定（关键）：
   · 覆盖层元素绝对定位于 #spectrumWrap（含左侧 48px 音名轴 + 滚动区）。
   · 屏幕坐标 = 音名轴宽度(48) + 内容坐标(t*px / midiToY) − 当前滚动量。
   · 竖线在"固定模式"下恒等于滚动区正中央 = 48 + vw/2，不随内容移动；
     横线随音高上下起伏；交点为二者交点（严格耦合到谱线）。 */
const AXIS_W = 48;                                 // 左侧音名轴宽度（与 CSS #noteAxis 一致）
state.crosshair = { tPos: null, midi: null, fixed: false };
state.clickMarker = { tPos: null, midi: null, text: "", until: 0 };
// 滚动区可视中心在 #spectrumWrap 坐标系中的位置（竖线锁定位置）
function viewCenterX(){ return AXIS_W + scrollArea.clientWidth / 2; }
// 显示十字准星：tPos=时间位置，midi=音高，fixed=true 表示竖线锁在屏幕中央
function showCrosshair(tPos, midi, fixed){
  state.crosshair.tPos = tPos;
  state.crosshair.midi = midi;
  if (fixed !== undefined) state.crosshair.fixed = !!fixed;
  renderCrosshair();
}
function renderCrosshair(){
  const { tPos, midi, fixed } = state.crosshair;
  if (tPos == null) return;
  const padL = state.padL || 0;
  const contentX = padL + tPos * state.px;                // 内容坐标（含左内边距）
  const x = fixed ? viewCenterX() : (AXIS_W + contentX - scrollArea.scrollLeft);
  const y = midiToY(midi) - scrollArea.scrollTop;
  const vh = scrollArea.clientHeight;
  const vw = scrollArea.clientWidth;
  const inViewX = fixed || (x >= AXIS_W - 2 && x <= AXIS_W + vw + 2);
  const inViewY = y >= -2 && y <= vh + 2;
  // 竖线：固定模式下始终显示在屏幕中央
  crosshairV.style.display = inViewX ? "block" : "none";
  crosshairV.style.left = x + "px";
  // 横线/圆点：midi 为 null 时（静音段）隐藏，避免出现无意义的横线
  const havePitch = midi != null;
  crosshairH.style.display = havePitch ? "block" : "none";
  crosshairH.style.left = AXIS_W + "px";
  crosshairH.style.right = "0px";
  crosshairH.style.top = y + "px";
  crosshairH.style.opacity = inViewY ? "1" : "0.22";
  // 横线颜色随音高分三级：C5 以上亮黄 / C3–C5 白 / C3 以下红
  crosshairH.classList.toggle("hi", havePitch && midi > PITCH_HI);
  crosshairH.classList.toggle("lo", havePitch && midi < PITCH_LO);
  crosshairDot.style.display = (havePitch && inViewX && inViewY) ? "block" : "none";
  crosshairDot.style.left = x + "px";
  crosshairDot.style.top = y + "px";
  crosshairDot.style.background = (midi > PITCH_HI) ? COLOR_HI
    : (midi < PITCH_LO) ? COLOR_LOW : "#ff1744";
  // 音高标签框（圆滑小矩形）：显示在红点右侧，颜色随音高分级
  crosshairTag.className = pitchClass(midi == null ? 60 : midi);
  if (havePitch && inViewY && (fixed || inViewX)){
    crosshairTag.style.display = "block";
    crosshairTag.style.left = x + "px";
    crosshairTag.style.top = y + "px";
    const note = midiToNote(Math.round(midi));
    const hz = midiToFreq(Math.round(midi)).toFixed(1);
    crosshairTag.innerHTML = note + "<small>" + hz + "Hz</small>";
  } else {
    crosshairTag.style.display = "none";
  }
}
function hideCrosshair(){
  state.crosshair.tPos = null;
  state.crosshair.fixed = false;
  crosshairV.style.display = "none";
  crosshairH.style.display = "none";
  crosshairDot.style.display = "none";
  crosshairTag.style.display = "none";
}
// 录音中/回放中：竖线锁在屏幕中央，横线落在"频谱线最前端"音高上
let _chFadeTimer = null;
function updateCrosshair(tr, tNow, fixed){
  if (fixed){
    const pts = (tr && tr.points) || [];
    if (pts.length){
      const last = pts[pts.length - 1];
      const frontT = last.t + (tr.offset || 0);
      // 横线始终取"频谱线最前端"的音高；
      // 竖线恒在屏幕中央。当最前端尚未到达中线时不滚动，因此交点会暂时落在
      // 中央（横线为首音高）；一旦最前端越过中线，视角滚动使它恰好压在竖线上。
      state._lastMidi = last.midi;
      showCrosshair(frontT, last.midi, true);
    } else {
      // 无任何音高：竖线仍在中央，横线/圆点隐藏
      const centerT = scrollArea.scrollLeft / state.px;
      showCrosshair(centerT, null, true);
    }
    return;
  }
  if (!tr || !tr.points || !tr.points.length) return;
  const pts = tr.points;
  let pt = pts[pts.length - 1];
  for (let i = pts.length - 1; i >= 0; i--){ if (pts[i].t <= tNow){ pt = pts[i]; break; } }
  showCrosshair(pt.t + (tr.offset || 0), pt.midi, false);
  // 一段时间无更新后自动隐藏
  if (_chFadeTimer) clearTimeout(_chFadeTimer);
  _chFadeTimer = setTimeout(() => { if (state.mode !== "recording" && state.mode !== "playing") hideCrosshair(); }, 1200);
}

/* ====================== 点击频谱：绿色音高标记 ====================== */
let _clickMarkerTimer = null;
function showClickMarker(tPos, midi, noteText){
  state.clickMarker = { tPos, midi, text: noteText, until: Date.now() + 1800 };
  renderClickMarker();
  if (_clickMarkerTimer) clearTimeout(_clickMarkerTimer);
  _clickMarkerTimer = setTimeout(() => {
    state.clickMarker.until = 0;
    clickMarkerDot.style.display = "none";
    clickMarkerBox.style.display = "none";
  }, 1800);
}
function renderClickMarker(){
  if (!state.clickMarker.until || Date.now() > state.clickMarker.until) return;
  const { tPos, midi, text } = state.clickMarker;
  const x = AXIS_W + (state.padL || 0) + tPos * state.px - scrollArea.scrollLeft;
  const y = midiToY(midi) - scrollArea.scrollTop;
  clickMarkerDot.style.left = x + "px";  clickMarkerDot.style.top = y + "px";
  clickMarkerBox.style.left = x + "px";
  clickMarkerBox.style.top = y + "px";
  clickMarkerBox.textContent = text;
  clickMarkerDot.style.display = "block";
  clickMarkerBox.style.display = "block";
}
// 滚动时重算覆盖层位置
function resyncOverlays(){
  if (state.crosshair.tPos != null) renderCrosshair();
  renderClickMarker();
}
// 非录制/播放态：用户横向滑动时，让横线跟随"竖线所在时刻"的音高上下波动，
// 交点即当前时刻对应的谱线位置（导入/录音完成后查看时使用）
function updateCrosshairAtCenter(){
  if (state.mode === "recording" || state.mode === "playing") return;  // 这两种态由各自循环驱动
  const padL = state.padL || 0;
  const tAtCenter = scrollArea.scrollLeft / state.px;   // 竖线处的时间（内容坐标 − padL）
  let bestMidi = null, bestD = Infinity;
  for (const tr of state.tracks){
    if (tr.hidden || !tr.points || !tr.points.length) continue;
    const pts = tr.points;
    // 二分定位最近的音高点
    for (let i = pts.length - 1; i >= 0; i--){
      const tt = pts[i].t + (tr.offset || 0);
      const d = Math.abs(tt - tAtCenter);
      if (d < bestD){ bestD = d; bestMidi = pts[i].midi; }
      if (tt < tAtCenter - 1.5) break;
    }
  }
  if (bestMidi == null || bestD > 0.8){
    showCrosshair(tAtCenter, null, true);   // 竖线仍在中央，横线隐藏
  } else {
    showCrosshair(tAtCenter, bestMidi, true);
  }
}

/* ====================== 频谱绘制 ====================== */
// 性能要点：
//  · 背景网格只在"可视横向窗口"内绘制（超长录音不再逐秒遍历整幅画布）
//  · 每条轨道的 Path2D 缓存，仅在 px/offset/点数/padL 变化时重建
//  · 轨道点数多时自动关闭光晕（shadowBlur 是 canvas 最贵的操作）以保证帧率
//  · 只绘制横向可视范围内的点段，避免整条长线反复重绘
function _visibleTWindow(){
  const padL = state.padL || 0;
  const t0 = Math.max(0, (scrollArea.scrollLeft - padL) / state.px - 1);
  const t1 = (scrollArea.scrollLeft - padL + scrollArea.clientWidth) / state.px + 1;
  return [t0, t1];
}
function drawSpectrum(){
  const w = specCanvas.width, h = specCanvas.height;
  if (!w || !h) return; // 尺寸异常时跳过，避免 IndexSizeError 且不擦除已有内容
  const padL = state.padL || 0;
  const px = state.px;
  specCtx.clearRect(0,0,w,h);
  specCtx.fillStyle = "#000"; specCtx.fillRect(0,0,w,h);

  // 横向参考线（音高，每段半音）——浅灰色，确保黑底上清晰可见
  for (let m = MIN_MIDI; m <= MAX_MIDI; m++){
    const y = midiToY(m);
    const isC = NOTE_NAMES[((m%12)+12)%12] === "C";
    const isSharp = NOTE_NAMES[((m%12)+12)%12].indexOf("#") === 0;
    specCtx.strokeStyle = isC ? "rgba(215,215,225,.75)" : (isSharp ? "rgba(150,150,165,.34)" : "rgba(175,175,190,.52)");
    specCtx.lineWidth = isC ? 1.4 : 1;
    specCtx.beginPath(); specCtx.moveTo(0, y); specCtx.lineTo(w, y); specCtx.stroke();
  }
  // 纵向参考线（时间）——只画可视窗口
  const [vT0, vT1] = _visibleTWindow();
  const s0 = Math.max(0, Math.floor(vT0)), s1 = Math.ceil(vT1);
  specCtx.fillStyle = "#8a8a96"; specCtx.font = "10px sans-serif";
  specCtx.textBaseline = "bottom";
  specCtx.lineWidth = 1;
  specCtx.strokeStyle = "rgba(120,120,135,.18)";
  specCtx.beginPath();
  for (let s = s0; s <= s1; s++){
    const x = padL + s * px;
    specCtx.moveTo(x, 0); specCtx.lineTo(x, h);
  }
  specCtx.stroke();
  // 每 5 秒的高亮竖线 + 秒标签
  specCtx.strokeStyle = "rgba(140,140,155,.42)";
  specCtx.beginPath();
  for (let s = s0; s <= s1; s++){ if (s % 5 !== 0) continue; const x = padL + s * px; specCtx.moveTo(x, 0); specCtx.lineTo(x, h); }
  specCtx.stroke();
  for (let s = s0; s <= s1; s++){ if (s % 2 !== 0) continue; specCtx.fillText(s + "s", padL + s * px + 3, h - 3); }

  // 轨道数量决定是否启用光晕（多轨时关闭以保证顺滑帧率）
  const visibleTracks = state.tracks.filter(t => !t.hidden && t.points.length >= 2);
  const useGlow = visibleTracks.length <= 2;
  const cullPad = 60;   // 可视区外额外保留的像素（避免边缘突现）

  for (const tr of visibleTracks){
    // ---- Path2D 缓存：键值含 px/offset/padL/点数 ----
    const key = px.toFixed(2) + "|" + (tr.offset||0) + "|" + padL + "|" + tr.points.length + "|" + w;
    let cached = tr._path;
    if (!cached || cached.key !== key){
      const path = new Path2D();
      let started = false;
      for (const p of tr.points){
        const x = padL + (p.t + (tr.offset||0)) * px;
        const y = midiToY(p.midi);
        if (!started){ path.moveTo(x, y); started = true; } else path.lineTo(x, y);
      }
      cached = tr._path = { key, path };
    }
    const path = cached.path;
    // ---- 可视裁剪：只绘制落在可视区内的部分 ----
    const xL = scrollArea.scrollLeft - cullPad, xR = scrollArea.scrollLeft + scrollArea.clientWidth + cullPad;
    specCtx.save();
    specCtx.beginPath(); specCtx.rect(xL, 0, xR - xL, h); specCtx.clip();
    specCtx.lineJoin = "round"; specCtx.lineCap = "round";
    if (useGlow){
      // ① 外层彩色光晕（最醒目）
      specCtx.shadowColor = tr.color; specCtx.shadowBlur = 14;
      specCtx.strokeStyle = tr.color; specCtx.lineWidth = 3.6;
      specCtx.stroke(path);
      // ② 中层亮色实线（提高饱和度与亮度）
      specCtx.shadowBlur = 6;
      specCtx.strokeStyle = lighten(tr.color, 0.35); specCtx.lineWidth = 2.2;
      specCtx.stroke(path);
    } else {
      // 多轨：单层描边（无光晕）——大幅降低 GPU/CPU 开销
      specCtx.strokeStyle = lighten(tr.color, 0.2); specCtx.lineWidth = 2.4;
      specCtx.stroke(path);
    }
    // ③ 内层白色高光芯线（让线条"发光"）
    specCtx.shadowBlur = 0;
    specCtx.strokeStyle = "rgba(255,255,255,.85)"; specCtx.lineWidth = 0.9;
    specCtx.stroke(path);
    // 高亮描边（点击列表时）
    if (tr.highlight){
      specCtx.shadowColor = "rgba(255,224,0,.95)"; specCtx.shadowBlur = 16;
      specCtx.strokeStyle = "rgba(255,224,0,.95)"; specCtx.lineWidth = 5.5;
      specCtx.stroke(path);
    }
    // 同色柔光闪烁（圆按钮切换显隐时触发，约 640ms 一个明暗周期）
    if (tr.glowUntil && performance.now() < tr.glowUntil){
      const phase = (performance.now() % 640) / 640;
      const a = 0.25 + 0.75 * (0.5 - 0.5 * Math.cos(phase * Math.PI * 2));
      specCtx.shadowColor = tr.color; specCtx.shadowBlur = 26;
      specCtx.strokeStyle = tr.color; specCtx.globalAlpha = a;
      specCtx.lineWidth = 8.5;
      specCtx.stroke(path);
      specCtx.strokeStyle = lighten(tr.color, 0.55);
      specCtx.shadowBlur = 34; specCtx.lineWidth = 4;
      specCtx.stroke(path);
      specCtx.globalAlpha = 1;
    }
    specCtx.restore();
  }
}
// 将颜色提亮（amount 0~1），用于让线条更亮
function lighten(hex, amount){
  try {
    let c = hex.replace("#","");
    if (c.length === 3) c = c.split("").map(x=>x+x).join("");
    const r = parseInt(c.slice(0,2),16), g = parseInt(c.slice(2,4),16), b = parseInt(c.slice(4,6),16);
    const f = (v) => Math.min(255, Math.round(v + (255 - v) * amount));
    return "rgb(" + f(r) + "," + f(g) + "," + f(b) + ")";
  } catch(e){ return hex; }
}

/* ====================== 实时波形 ====================== */
function drawWave(buf){
  const w = waveCanvas.width, h = waveCanvas.height;
  waveCtx.clearRect(0,0,w,h);
  waveCtx.fillStyle = "#050505"; waveCtx.fillRect(0,0,w,h);
  if (!buf) return;
  waveCtx.strokeStyle = "#ffe000"; waveCtx.lineWidth = 1.5 * DPR; waveCtx.beginPath();
  const slice = w / buf.length;
  for (let i=0;i<buf.length;i++){
    const v = buf[i] * 0.9;
    const y = (h/2) + v * h/2;
    const x = i * slice;
    if (i===0) waveCtx.moveTo(x,y); else waveCtx.lineTo(x,y);
  }
  waveCtx.stroke();
}

/* ====================== 音频上下文 ====================== */
function getCtx(){
  if (!state.audioCtx) state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (state.audioCtx.state === "suspended") state.audioCtx.resume();
  return state.audioCtx;
}

/* ====================== 气泡音效（实时合成，无外部文件） ====================== */
let soundOn = true;
function sfxBubble(kind){
  if (!soundOn) return;
  try {
    const ctx = getCtx();
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = "sine";
    let f0 = 520, f1 = 880, dur = 0.12, vol = 0.16;
    if (kind === "send"){ f0 = 440; f1 = 1180; dur = 0.17; vol = 0.2; }   // 发送：明亮上扬
    else if (kind === "open"){ f0 = 360; f1 = 720; dur = 0.14; }          // 切标签：开
    else if (kind === "close"){ f0 = 680; f1 = 320; dur = 0.12; }         // 切标签：关
    else if (kind === "tick"){ f0 = 760; f1 = 760; dur = 0.05; vol = 0.1; } // 轻提示
    else if (kind === "rec"){ f0 = 300; f1 = 900; dur = 0.15; vol = 0.18; }
    else if (kind === "stop"){ f0 = 900; f1 = 300; dur = 0.13; }
    osc.frequency.setValueAtTime(f0, t);
    osc.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.03);
  } catch(e){}
}

/* ====================== 权限通道（麦克风 / 存储） ====================== */
// 麦克风只在安全上下文可用：https / localhost / 127.0.0.1（file:// 不算，getUserMedia 通常为 undefined）
function isSecure(){
  const host = location.hostname;
  return !!(window.isSecureContext && (location.protocol === "https:" || host === "localhost" || host === "127.0.0.1" || host === "::1"));
}
function protoLabel(){
  if (location.protocol === "file:") return "file:// 本地文件";
  return location.protocol + "//" + location.host;
}
// 检测常见的「内置浏览器」——微信/QQ/钉钉/微博等常屏蔽或限制麦克风
function inAppBrowser(){
  const ua = navigator.userAgent || "";
  if (/MicroMessenger/i.test(ua)) return "微信内置浏览器";
  if (/QQ\//i.test(ua) || /QQBrowser/i.test(ua)) return "QQ 内置浏览器";
  if (/DingTalk/i.test(ua)) return "钉钉内置浏览器";
  if (/Weibo/i.test(ua)) return "微博内置浏览器";
  if (/AlipayClient/i.test(ua)) return "支付宝内置浏览器";
  if (/baiduboxapp/i.test(ua)) return "百度内置浏览器";
  return "";
}
async function queryMicState(){
  try { const st = await navigator.permissions.query({ name: "microphone" }); return st.state; }
  catch(e){ return "unknown"; }
}
// 诊断：把任意异常翻译成可操作的错误码
function classifyMicError(err){
  const name = err && err.name || "";
  if (name === "NotAllowedError" || name === "PermissionDeniedError") return "DENIED";
  if (name === "NotFoundError" || name === "DevicesNotFoundError") return "NODEVICE";
  if (name === "NotReadableError" || name === "TrackStartError") return "BUSY";
  if (name === "OverconstrainedError" || name === "ConstraintNotSatisfiedError") return "CONSTRAINT";
  if (name === "SecurityError") return "INSECURE";
  if (name === "AbortError") return "ABORT";
  return "UNKNOWN";
}
// 主动请求麦克风：带降级链（严格约束 → 宽松约束 → 最简 audio:true）
// 注意：不再用 permissions.query 的结果做「预判拦截」——它在部分浏览器（含 iOS Safari、
// 部分 Android Chrome）会返回陈旧或错误的状态，导致「明明已授权却被判为 denied」。
// 权限判定一律交给 getUserMedia 本身。
async function requestMic(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    throw { code: "UNSUPPORTED", msg: "当前环境未提供 navigator.mediaDevices.getUserMedia（协议：" + protoLabel() + "）" };
  if (!isSecure())
    throw { code: "INSECURE" };

  // 约束降级链：先要原始信号（利于音高检测），失败再逐步放宽
  const constraints = [
    { audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false } },
    { audio: { echoCancellation:false } },
    { audio: true }   // 你贴的最简形式，作为最终兜底
  ];
  let lastErr = null;
  for (const c of constraints){
    try {
      return await navigator.mediaDevices.getUserMedia(c);
    } catch(err){
      lastErr = err;
      const code = classifyMicError(err);
      // 权限类错误无需继续降级，直接抛出
      if (code === "DENIED" || code === "INSECURE") throw { code, err, msg: err.message };
      // 设备不存在也无需继续
      if (code === "NODEVICE") throw { code, err, msg: err.message };
      // 其余（约束/占用/未知）尝试下一个更宽松的约束
    }
  }
  throw { code: classifyMicError(lastErr), err: lastErr, msg: lastErr && lastErr.message };
}
// 精确错误诊断：按错误码给出可操作指引

// 下载：支持时走 File System Access（真实「选择保存位置」存储通道）
async function saveWithPicker(blob, filename){

    try {
      const handle = await window.showSaveFilePicker({ suggestedName: filename });
      const w = await handle.createWritable();
      await w.write(blob); await w.close();
      return true;
    } catch(e){ if (e && e.name === "AbortError") return false; /* 其它情况回退 */ }
  }

  return true;

/* ====================== 录音 ====================== */
async function startRecording(){
  let stream;
  try {
    stream = await requestMic();
  } catch(err){
    if (err && err.code) showPermGuide(err.code, err.msg);
    else toast("无法访问麦克风：" + (err && err.message || err));
    return;
  }
  try {
    const ctx = getCtx();
    const source = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;
    source.connect(analyser);

    const mime = pickRecorderMime();
    const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    const chunks = [];
    mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };

    // 续录策略：再次点击录音 = 在上一段末尾继续（同一文件、同一颜色、不留空档）
    // 只有通过侧栏「叠加录制」才新开一条轨道并换色。
    let cur = state.tracks[state.activeTrackIdx] || state.tracks[0];
    if (!cur){
      cur = newTrack("第 1 段录音", 0);
      state.tracks = [cur]; state.activeTrackIdx = 0;
    }
    // 续录起始时刻 = 该轨道已有内容的末尾（若已有）。不留空档。
    const prevEnd = (cur.points && cur.points.length)
      ? cur.points[cur.points.length - 1].t + 0.05
      : (cur.duration || 0);
    cur.baseTime = prevEnd;
    cur._recChunks = cur._recChunks || [];   // 累积多段录音的音频分片
    cur._recBaseDur = cur.duration || 0;     // 续录前的音频时长

    const track = cur;
    track.startTime = performance.now();
    track.stream = stream; track.analyser = analyser; track.recorder = mr; track.source = source;

    const timeBuf = new Float32Array(analyser.fftSize);
    emptyHint.classList.add("hidden");
    comparePanel.classList.toggle("show", state.compareMode);

    // 录制：每 1 秒落一片，便于分段存储
    mr.start(1000);
    state.mode = "recording";
    state.followRec = true;
    micBtn.classList.add("rec"); micBtn.textContent = "■";
    playBtn.disabled = true;

    let lastPoint = 0, lastDraw = 0, lastSeg = -1;
    const baseT = track.baseTime || 0;
    function loop(){
      if (state.mode !== "recording") return;
      const now = performance.now();
      const t = baseT + (now - track.startTime) / 1000;   // 续录：时间从上次末尾接着走
      analyser.getFloatTimeDomainData(timeBuf);
      drawWave(timeBuf);
      // 分段提示（每 60 秒）：录音数据已由 MediaRecorder 分片，不会一次性占满内存
      const seg = Math.floor(t / SEGMENT_SECONDS);
      if (seg !== lastSeg && seg > 0){
        lastSeg = seg;
        track.segments = seg + 1;
        toast("已录制 " + Math.floor(t) + "s（第 " + (seg + 1) + " 段）");
      }
      const f = autoCorrelate(timeBuf, ctx.sampleRate);
      if (f > 0 && now - lastPoint > 60){ // 约 16Hz 采样，节省存储与绘制
        lastPoint = now;
        track.points.push({ t, f, midi: freqToMidi(f), note: midiToNote(freqToMidi(f)) });
        state._lastMidi = freqToMidi(f);
      }
      // 横向：无论是否有声音，都按"录音时间"推动内容左移，使最新时刻落在屏幕中线
      followTimelineByTime(t);
      // 每帧都更新跟随目标并驱动（音高剧烈跳动、静音段都持续跟进，不中断）
      if (state.followRec){ tryAutofollow(); driveAutofollow(); }
      updateCrosshair(track, t, true); // 十字准星：竖线锁屏幕中央，横线随音高起伏
      if (now - lastDraw > 80){ lastDraw = now; resizeForGrowingTime(track); drawSpectrum(); syncRulerScroll(); } // 约 12fps 自适应重绘
      track._raf = requestAnimationFrame(loop);
    }
    loop();

    mr.onstop = async () => {
      const blob = new Blob(chunks, { type: mr.mimeType || "audio/webm" });
      track._recChunks = (track._recChunks || []).concat([blob]);
      stream.getTracks().forEach(t => t.stop());
      // 合并该轨道所有录音分片 → 单一音频缓冲（续录后仍是一条完整音轨）
      try {
        const merged = new Blob(track._recChunks, { type: mr.mimeType || "audio/webm" });
        const ab = await merged.arrayBuffer();
        track.audioBuffer = await ctx.decodeAudioData(ab);
        track.duration = track.audioBuffer.duration;
        track.blob = merged; track.mime = mr.mimeType;
      } catch(e){ console.warn("解码失败", e); }
      drawSpectrum();
    };
  } catch(err){
    toast("无法访问麦克风：" + err.message);
  }
}
function pickRecorderMime(){
  const cands = ["audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus","audio/mp4"];
  for (const c of cands) if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c;
  return "";
}
function stopRecording(){
  const tr = state.tracks[state.activeTrackIdx];
  if (tr && tr.recorder && tr.recorder.state !== "inactive"){
    tr.recorder.stop();
  }
  state.mode = "idle";
  state.followRec = false;
  state.userScrolling = false;
  state.autofollowPausedUntil = 0;
  if (_followRAF){ cancelAnimationFrame(_followRAF); _followRAF = null; }
  micBtn.classList.remove("rec"); micBtn.textContent = "●";
  if (state.tracks.some(t => t.points.length)) playBtn.disabled = false;
  // 停止后重算内容宽度（把最后一段静音的时间也纳入时间轴）
  try { resizeCanvases(); } catch(e){}
}

/* ====================== 播放 ====================== */
let playHandles = [];
// 当前竖线（屏幕中央）所截到的时间轴时刻 —— 播放起点
function centerTime(){
  return Math.max(0, scrollArea.scrollLeft / state.px);
}
// 找到该时刻附近最近的音高（用于播放起点提示）
function nearestPitchAt(t){
  let best = null, bestD = Infinity;
  for (const tr of state.tracks){
    if (tr.hidden || !tr.points || !tr.points.length) continue;
    for (let i = tr.points.length - 1; i >= 0; i--){
      const tt = tr.points[i].t + (tr.offset || 0);
      const d = Math.abs(tt - t);
      if (d < bestD){ bestD = d; best = { tr, pt: tr.points[i], tt }; }
      if (tt < t - 2) break;
    }
  }
  return (best && bestD <= 2) ? best : null;
}
function stopAllPlayback(){
  try { playHandles.forEach(h => { try{ h.source.stop(); }catch(e){} try{ h.gain.disconnect(); }catch(e){} }); } catch(e){}
  playHandles = [];
  if (typeof _scanTimer !== "undefined" && _scanTimer){ clearTimeout(_scanTimer); _scanTimer = null; }
  if (typeof _playFollowRAF !== "undefined" && _playFollowRAF){ cancelAnimationFrame(_playFollowRAF); _playFollowRAF = null; }
  document.querySelectorAll(".pitchLabel").forEach(el => el.remove());
  state.tracks.forEach(t => { if (t._label){ try{ t._label.remove(); }catch(e){} t._label = null; } });
  state.mode = "idle";
  playBtn.textContent = "▶ 播放"; playBtn.disabled = !state.tracks.some(t=>t.points.length);
  cancelAnimationFrame(stopAllPlayback._raf);
}
async function playAll(){
  if (state.mode === "playing"){ stopAllPlayback(); return; }
  // 播放起点 = 竖线（屏幕中央）截到的频谱线时刻，而非每次从头
  const startT = centerTime();
  const near = nearestPitchAt(startT);
  // 严格按时间轴扫描发声：多轨对比 / 多个音频轨时，只有播放头扫过谱线才发声
  const audioTracks = state.tracks.filter(t => !t.hidden && t.audioBuffer && t.points.length);
  if (state.compareMode || audioTracks.length > 1){ rebuildTimelineScan(startT); return; }
  const ctx = getCtx();
  const hasAudio = state.tracks.some(t => t.audioBuffer && !t.hidden);
  if (!hasAudio) toast("无音频数据，按时间轴演示音高（无声）");
  else if (near) toast("从 " + startT.toFixed(1) + "s 处（" + near.pt.note + "）开始播放");
  state.mode = "playing";
  playBtn.textContent = "■ 停止";
  document.querySelectorAll(".pitchLabel").forEach(el => el.remove());
  state.tracks.forEach(t => { if (t._label){ try{ t._label.remove(); }catch(e){} t._label = null; } });
  state.followRec = true;              // 播放时开启视角跟随
  state.userScrolling = false;
  state.autofollowPausedUntil = 0;

  const startCtx = ctx.currentTime;
  for (const tr of state.tracks){
    if (tr.hidden) continue;
    if (!tr.points.length) continue;
    const off = tr.offset || 0;
    if (tr.audioBuffer){
      const src = ctx.createBufferSource();
      src.buffer = tr.audioBuffer;
      const gain = ctx.createGain();
      gain.gain.value = tr.bgm ? 0.5 : 1.0;
      src.connect(gain).connect(ctx.destination);
      // 从竖线处起播：音频内部偏移 = 播放头时刻（相对该轨）
      const aStart = Math.max(0, Math.min(tr.audioBuffer.duration, startT - off));
      try { src.start(0, aStart); } catch(e){ continue; }
      const h = { source: src, gain, track: tr, startCtx, offset: off, aStart, ended: false, virtual: false };
      src.onended = () => { h.ended = true; };
      playHandles.push(h);
    } else {
      // 无音频：虚拟播放（按真实时间推进音高标签）
      const dur = tr.points[tr.points.length-1].t;
      const h = { source: null, gain: null, track: tr, startCtx, offset: off, aStart: Math.max(0, startT - off), ended: false, virtual: true, duration: dur };
      playHandles.push(h);
    }
  }
  if (!playHandles.length){ state.mode="idle"; playBtn.textContent="▶ 播放"; return; }

  function tick(){
    let anyAlive = false;
    let playT = null;
    for (const h of playHandles){
      if (h.ended) continue;
      const elapsed = ctx.currentTime - h.startCtx; // 从起播点开始的真实时间
      const tPos = h.aStart + elapsed + h.offset;   // 频谱时间轴位置
      updatePitchLabel(h.track, tPos, elapsed);
      if (playT == null || tPos < playT) playT = tPos;
      const dur = h.virtual ? (h.duration - h.aStart) : (h.track.audioBuffer.duration - h.aStart);
      if (elapsed < dur + 0.05) anyAlive = true;
    }
    // 播放时视角跟随：让播放点保持在屏幕正中央
    followPlayback(playT);
    if (anyAlive && state.mode === "playing"){ stopAllPlayback._raf = requestAnimationFrame(tick); }
    else { stopAllPlayback(); }
  }
  tick();
}
// 播放时视角跟随（内容坐标 t → 让 t 落在屏幕中线；用户在滑动则暂停）
let _playFollowRAF = null;
function followPlayback(t){
  if (t == null) return;
  if (!state.followRec || state.userScrolling || Date.now() < (state.autofollowPausedUntil || 0)) return;
  state.followTargetX = Math.max(0, t * state.px);
  if (_playFollowRAF) return;
  const step = () => {
    _playFollowRAF = null;
    if (state.mode !== "playing") return;
    if (!state.followRec || state.userScrolling || Date.now() < (state.autofollowPausedUntil || 0)) return;
    if (typeof state.followTargetX === "number"){
      const dx = state.followTargetX - scrollArea.scrollLeft;
      if (Math.abs(dx) > 0.5){
        scrollArea.scrollLeft += dx * 0.18;
        syncRulerScroll?.(); resyncOverlays?.(); drawSpectrum();
        _playFollowRAF = requestAnimationFrame(step);
      }
    }
  };
  _playFollowRAF = requestAnimationFrame(step);
}
function updatePitchLabel(tr, tPos, elapsed){
  // 找到该时间点最近的音高点
  let pt = null;
  const pts = tr.points;
  if (pts.length){
    // 二分 / 线性查找
    let lo = 0, hi = pts.length - 1;
    while (lo < hi){ const mid = (lo+hi)>>1; if (pts[mid].t < tPos) lo = mid+1; else hi = mid; }
    let idx = lo;
    if (idx > 0 && Math.abs(pts[idx].t - tPos) > Math.abs(pts[idx-1].t - tPos)) idx--;
    pt = pts[idx];
  }
  let label = tr._label;
  if (!pt || elapsed < 0){
    if (label) label.style.display = "none";
    return;
  }
  if (!label){
    label = document.createElement("div");
    label.className = "pitchLabel";
    scrollArea.appendChild(label);
    tr._label = label;
  }
  label.style.display = "block";
  const x = state.padL + (pt.t + (tr.offset||0)) * state.px;   // 含左内边距，保证与谱线对齐
  const y = midiToY(pt.midi);
  label.style.left = x + "px";
  label.style.top = y + "px";
  label.textContent = pt.note;
  label.classList.toggle("high", pt.midi > PITCH_HI);
  label.classList.toggle("low", pt.midi < PITCH_LO);
  label.style.color = pitchColor(pt.midi);
  label.style.borderColor = pitchColor(pt.midi);
  // 视角跟随由 followPlayback 统一负责，这里不再强制滚动，避免与跟随打架
}
/* 重播：严格按时间轴，播放头扫过谱线时才发声。
   以播放头（视口中心）所在时刻为基准，切出一个很短的扫描窗口 [sweepT, sweepT+STEP)，
   只有该窗口内存在谱线的轨道才播放其对应片段；片段播完后播放头自动前进，
   继续扫描下一段谱线，从而实现"时间轴扫过哪里就响哪里"。 */
function rebuildTimelineScan(startT){
  const wasPlaying = state.mode === "playing";         // 递归推进时已处于播放态
  stopAllPlayback();                                   // 停掉上一窗口的发声句柄（会置 idle）
  state.mode = wasPlaying ? "playing" : "idle";        // 递归推进时保持播放态，避免推进逻辑被打断
  if (_scanTimer){ clearTimeout(_scanTimer); _scanTimer = null; }
  const ctx = getCtx();
  const STEP = 0.35;                                   // 每次扫描推进的时窗（秒）
  // 起点：由外部传入（竖线截取处），否则用屏幕中央
  const baseT = (typeof startT === "number" && isFinite(startT)) ? startT : centerTime();
  // 首次进入（非递归）：把视角对齐到起点，使播放头恰好位于中线
  if (!wasPlaying){
    state.followRec = true; state.userScrolling = false; state.autofollowPausedUntil = 0;
    scrollArea.scrollLeft = Math.max(0, baseT * state.px);
    syncRulerScroll?.(); resyncOverlays?.();
  }
  const sweepT = baseT;                                // 播放头当前时刻
  const started = [];
  for (let i = 0; i < state.tracks.length; i++){
    const tr = state.tracks[i];
    if (tr.hidden || !tr.points.length) continue;
    // 该轨道在本次时窗内的谱线点
    const ts = tr.points.filter(p => {
      const tt = p.t + (tr.offset||0);
      return tt >= sweepT && tt < sweepT + STEP;
    });
    if (!ts.length || !tr.audioBuffer) continue;
    const t0 = Math.min(...ts.map(p => p.t));
    const t1 = Math.min(...ts.map(p => p.t)) + STEP;
    const src = ctx.createBufferSource();
    src.buffer = tr.audioBuffer;
    const gain = ctx.createGain();
    const vol = tr.bgm ? 0.5 : 1.0;
    gain.gain.value = vol;
    src.connect(gain).connect(ctx.destination);
    // 只播放播放头扫过的这一小段
    const avail = (tr.audioBuffer.duration || t1) - (t0 + (tr.offset||0));
    const seg = Math.max(0.05, Math.min(STEP, avail));
    try { src.start(0, Math.max(0, t0 + (tr.offset||0)), seg); } catch(e){ continue; }
    const h = { source: src, gain, track: tr, virtual: false, t0, t1, offset: tr.offset||0 };
    src.onended = () => { h.ended = true; };
    playHandles.push(h);
    started.push(tr);
  }
  if (!started.length){
    // 当前窗口没有谱线：若前方还有谱线就继续滚动扫描，否则结束
    const nextAny = state.tracks.some(tr => !tr.hidden && tr.points.some(p => p.t + (tr.offset||0) > sweepT));
    if (nextAny && state.mode === "playing"){
      scrollArea.scrollLeft = Math.min(maxScrollLeft?.() ?? 1e9, scrollArea.scrollLeft + STEP * state.px * 0.5);
      syncRulerScroll?.(); resyncOverlays?.();
      _scanTimer = setTimeout(rebuildTimelineScan, 60);
      return;
    }
    toast("播放头下没有谱线，请先滑动到有频谱的位置");
    state.mode = "idle"; playBtn.textContent = "▶ 播放";
    return;
  }
  state.mode = "playing";
  playBtn.textContent = "■ 停止";
  // 播放头推进一小步，继续扫描下一段谱线
  _scanTimer = setTimeout(() => {
    if (state.mode !== "playing") return;
    const nx = scrollArea.scrollLeft + STEP * state.px;
    const mx = (scrollArea.scrollWidth - scrollArea.clientWidth);
    if (nx >= mx){
      // 到底了：若还有谱线在更远处（横向无限延伸），继续创建
      if (state.tracks.some(tr => !tr.hidden && tr.points.some(p => (p.t + (tr.offset||0)) * state.px > mx))){
        growTimelineIfNeeded?.();
        scrollArea.scrollLeft = nx;
      } else { stopAllPlayback(); return; }
    } else {
      scrollArea.scrollLeft = nx;
    }
    syncRulerScroll?.(); resyncOverlays?.();
    rebuildTimelineScan();
  }, STEP * 1000);
}
function maxScrollLeft(){ return Math.max(0, scrollArea.scrollWidth - scrollArea.clientWidth); }
function growTimelineIfNeeded(){ /* 占位：时间轴随内容自适应宽度，无需额外处理 */ }

/* ====================== 离线分析音频文件 ====================== */
async function analyzeAudioBuffer(buffer, hopOpt){
  const data = buffer.getChannelData(0);
  const sr = buffer.sampleRate;
  const win = 2048, hop = hopOpt || 1024;
  const points = [];
  const tmp = new Float32Array(win);
  for (let i=0; i + win <= data.length; i += hop){
    tmp.set(data.subarray(i, i+win));
    const f = autoCorrelate(tmp, sr);
    if (f > 0){
      const t = i / sr;
      points.push({ t, f, midi: freqToMidi(f), note: midiToNote(freqToMidi(f)) });
    }
  }
  return points;
}

/* ====================== 轨道管理 ====================== */
function newTrack(name, colorIdx){
  return {
    id: "t" + Date.now() + Math.random().toString(36).slice(2,6),
    name: name || "录音",
    colorIdx: colorIdx,
    color: TRACK_COLORS[colorIdx % TRACK_COLORS.length],
    points: [], offset: 0, bgm: false, highlight: false, hidden: false, glowUntil: 0,
    blob: null, audioBuffer: null, duration: 0,
  };
}
function addCompareTrackFromBuffer(name, buffer){
  const tr = newTrack(name, state.tracks.length);
  tr.audioBuffer = buffer;
  tr.duration = buffer.duration;
  // 超长音频降采样分析：>3 分钟时增大 hop，避免解析卡死
  const dataLen = buffer.length || (buffer.getChannelData ? buffer.getChannelData(0).length : 0);
  const maxFrames = Math.max(1, Math.floor(dataLen / 2048));
  const hop = maxFrames > 40000 ? 4096 : 1024;
  analyzeAudioBuffer(buffer, hop).then(pts => {
    tr.points = pts;
    drawSpectrum(); buildComparePanel();
  }).catch(() => {});
  state.tracks.push(tr);
  return tr;
}

    body.appendChild(offWrap);
  });

  // ③ 底部折叠按钮
  const collapseBtn = document.createElement("div");
  collapseBtn.className = "cmpCollapseBtn";
  collapseBtn.title = "折叠 / 展开";
  collapseBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>`;
  collapseBtn.addEventListener("click", () => {
    comparePanel.classList.toggle("collapsed");
    vibrate(); sfxBubble("tick");
    // 折叠/展开会改变可视高度，重绘频谱并同步覆盖层
    drawSpectrum(); resyncOverlays?.();
  });
  comparePanel.appendChild(collapseBtn);

  // ④ 圆按钮（渲染 + 绑定）
  renderCompareCircles();

  // ⑤ 绑定主体事件
  comparePanel.querySelectorAll(".cmpName").forEach(n => {
    n.addEventListener("click", () => focusTrack(Number(n.closest(".cmpRow").dataset.i)));
  });
  comparePanel.querySelectorAll(".cmpIcon.clock").forEach(ic => {
    ic.addEventListener("click", () => {
      const i = Number(ic.dataset.i);
      const wrap = comparePanel.querySelector(`.cmpOffsetWrap[data-i="${i}"]`);
      wrap.classList.toggle("show");
      ic.classList.toggle("on");
      vibrate(); sfxBubble("tick");
    });
  });
  comparePanel.querySelectorAll(".cmpIcon.bgm").forEach(ic => {
    ic.addEventListener("click", () => {
      const i = Number(ic.dataset.i);
      state.tracks[i].bgm = !state.tracks[i].bgm;
      ic.classList.toggle("on", state.tracks[i].bgm);
      vibrate(); sfxBubble("tick");
      if (state.mode === "playing"){ // 即时生效
        const h = playHandles.find(p => p.track === state.tracks[i]);
        if (h) h.gain.gain.value = state.tracks[i].bgm ? 0.5 : 1.0;
      }
    });
  });
  comparePanel.querySelectorAll('input[type=range]').forEach(r => {
    r.addEventListener("input", () => {
      const i = Number(r.closest(".cmpOffsetWrap").dataset.i);
      state.tracks[i].offset = parseFloat(r.value);
      r.parentElement.querySelector(".offval").textContent = parseFloat(r.value).toFixed(1);
      drawSpectrum();
    });
  });
}

/* 渲染圆按钮（颜色 = 每条频谱线颜色，序号 = 文件号） */
function renderCompareCircles(){
  const row = document.getElementById("cmpCircleRow");
  if (!row) return;
  row.innerHTML = "";
  state.tracks.forEach((tr, i) => {
    const b = document.createElement("div");
    b.className = "cmpCircleBtn" + (tr.hidden ? " off" : "");

    b.title = tr.name + (tr.hidden ? "（已隐藏）" : "");

      e.stopPropagation();
      toggleTrackHidden(i);
    });
    row.appendChild(b);

/* 显示/隐藏某条频谱线 */
function toggleTrackHidden(i){
  const tr = state.tracks[i];
  if (!tr) return;
  tr.hidden = !tr.hidden;
  if (tr.hidden){
    flashNotice("文件" + (i + 1) + "号已被隐藏", 800);
  } else {
    flashNotice("文件" + (i + 1) + "号已展示", 800);
    flashTrackGlow(i, 2); // 展示时该频谱线同色柔光闪烁 2 下
  }
  vibrate();
  renderCompareCircles();
  hideCrosshair?.();
  drawSpectrum();
  resyncOverlays?.();
}

/* 让某条频谱线以自身颜色柔光闪烁 n 下 */
function flashTrackGlow(i, times){
  const tr = state.tracks[i];
  if (!tr) return;
  tr.glowUntil = performance.now() + (times || 2) * 640;
  const loop = () => {
    if (!tr.glowUntil || performance.now() > tr.glowUntil){ tr.glowUntil = 0; drawSpectrum(); return; }
    drawSpectrum();
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
function focusTrack(i){
  // 高亮对应线条 + 圆点加白圈
  if (state.tracks[i]?.hidden) toggleTrackHidden(i); else flashTrackGlow(i, 2);
  state.tracks.forEach((tr, idx) => tr.highlight = (idx === i));
  comparePanel.querySelectorAll(".cmpDot").forEach((d, idx) => d.classList.toggle("active", idx === i));
  drawSpectrum();
  setTimeout(() => {
    state.tracks.forEach(tr => tr.highlight = false);
    comparePanel.querySelectorAll(".cmpDot").forEach(d => d.classList.remove("active"));
    drawSpectrum();
  }, 2500);
}
function vibrate(){ if (navigator.vibrate) navigator.vibrate(40); }

/* ====================== WAV 编码 ====================== */
function audioBufferToWav(buffer){
  const numCh = buffer.numberOfChannels, sr = buffer.sampleRate, frames = buffer.length;
  const bytesPer = 2, blockAlign = numCh * bytesPer, dataSize = frames * blockAlign;
  const ab = new ArrayBuffer(44 + dataSize);
  const view = new DataView(ab);
  let off = 0;
  const ws = s => { for (let i=0;i<s.length;i++) view.setUint8(off++, s.charCodeAt(i)); };
  const w32 = v => { view.setUint32(off, v, true); off += 4; };
  const w16 = v => { view.setUint16(off, v, true); off += 2; };
  ws("RIFF"); w32(36 + dataSize); ws("WAVE");
  ws("fmt "); w32(16); w16(1); w16(numCh); w32(sr); w32(sr * blockAlign); w16(blockAlign); w16(16);
  ws("data"); w32(dataSize);
  const chans = []; for (let c=0;c<numCh;c++) chans.push(buffer.getChannelData(c));
  for (let i=0;i<frames;i++){
    for (let c=0;c<numCh;c++){
      let s = Math.max(-1, Math.min(1, chans[c][i]));
      view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true); off += 2;
    }
  }
  return new Blob([ab], { type: "audio/wav" });
}

function saveSessionToStorage(){
  const sessions = loadSessions();
  const tr = state.tracks[0];
  if (!tr || !tr.points.length){ toast("还没有可保存的录音"); return null; }
  const sess = {
    id: "s" + Date.now(),
    name: "录音 " + new Date().toLocaleString("zh-CN", {month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}),
    createdAt: Date.now(),
    duration: tr.duration || (tr.points.length ? tr.points[tr.points.length-1].t : 0),
    points: tr.points,
  };
  sessions.push(sess);
  localStorage.setItem("pitchSessions", JSON.stringify(sessions));
  renderSessList();
  return sess;
}
function loadSessions(){
  try { return JSON.parse(localStorage.getItem("pitchSessions") || "[]"); } catch(e){ return []; }
}
